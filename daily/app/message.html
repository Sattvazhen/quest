<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Messages · Candlelight Aloka</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-paper: #ffffff;
            --bg-sub: #f5f5f7;
            --text-dark: #1d1d1f;
            --text-muted: #86868b;
            --line-light: rgba(0, 0, 0, 0.06);
            --apple-blue: #007AFF;
            --apple-blue-light: #E5F1FF;
            --radius: 20px;
            --safe-bottom: env(safe-area-inset-bottom, 20px);
            --safe-top: env(safe-area-inset-top, 40px);
            --ease-curve: cubic-bezier(0.32, 0.72, 0, 1);
            --font-en: 'Inter', -apple-system, sans-serif;
            --font-tc: 'Noto Sans TC', 'PingFang TC', sans-serif;
            --glass-bg: rgba(245, 245, 247, 0.85);
        }
        [data-theme="dark"] {
            --bg-paper: #000000;
            --bg-sub: #1c1c1e;
            --text-dark: #f5f5f7;
            --text-muted: #8e8e93;
            --line-light: rgba(255, 255, 255, 0.1);
            --apple-blue-light: #0A2948;
            --glass-bg: rgba(28, 28, 30, 0.85);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-en);
            background-color: var(--bg-paper);
            color: var(--text-dark);
            -webkit-font-smoothing: antialiased;
            text-align: left;
            height: 100vh;
            /* 動態視口適配將由 JS 處理，避免輸入法彈出遮擋 */
            overflow: hidden;
            letter-spacing: 0.01em;
        }

        .view-hidden {
            display: none !important;
        }

        #app-section {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 100%;
            margin: 0 auto;
            background: var(--bg-paper);
            position: relative;
            overflow: hidden;
        }
        @media (min-width: 600px) {
            #app-section {
                max-width: 600px;
                border-left: 1px solid var(--line-light);
                border-right: 1px solid var(--line-light);
            }
        }

        .app-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: calc(var(--safe-top) + 24px) 32px 16px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--line-light);
            flex-shrink: 0;
            z-index: 10;
        }
        .app-header h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.8px;
            line-height: 1.1;
        }

        .main-view {
            flex: 1;
            overflow-y: auto;
            padding: 0 0 calc(88px + var(--safe-bottom));
            scroll-behavior: smooth;
        }
        .main-view::-webkit-scrollbar {
            display: none;
        }

        .chat-list-item {
            display: flex;
            align-items: center;
            padding: 16px 32px;
            cursor: pointer;
            transition: background-color 0.3s var(--ease-curve);
            gap: 16px;
            border-bottom: 1px solid var(--line-light);
        }
        .chat-list-item:active {
            background-color: var(--bg-sub);
        }

        .avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            object-fit: cover;
            background-color: var(--bg-sub);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 600;
            color: var(--text-muted);
            overflow: hidden;
            text-transform: uppercase;
        }

        .chat-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
            min-width: 0;
        }
        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 4px;
        }
        .chat-name {
            font-size: 17px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-time {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
            flex-shrink: 0;
            margin-left: 12px;
        }
        .chat-preview {
            font-size: 15px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .unread-badge {
            background-color: var(--apple-blue);
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            padding: 0 6px;
            border-radius: 10px;
            min-width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-left: 8px;
        }

        .bottom-tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: calc(64px + var(--safe-bottom));
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--line-light);
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
            padding-top: 12px;
            z-index: 100;
        }
        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-muted);
            gap: 6px;
            transition: color 0.4s var(--ease-curve), transform 0.4s var(--ease-curve);
            width: 20%;
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }
        .tab-item.active {
            color: var(--text-dark);
        }
        .tab-item:active {
            transform: scale(0.9);
        }
        .tab-item svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .tab-item span {
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        #chat-room {
            position: absolute;
            inset: 0;
            background: var(--bg-paper);
            z-index: 150;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.4s var(--ease-curve);
            pointer-events: none;
        }
        #chat-room.open {
            transform: translateX(0);
            pointer-events: auto;
        }

        .room-header {
            display: flex;
            align-items: center;
            padding: calc(var(--safe-top) + 12px) 24px 16px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--line-light);
            z-index: 10;
            gap: 16px;
            flex-shrink: 0;
        }
        .back-btn {
            background: none;
            border: none;
            color: var(--apple-blue);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 0;
            font-size: 17px;
            font-weight: 500;
            gap: 4px;
        }
        .room-title {
            font-size: 17px;
            font-weight: 600;
            text-align: left;
            flex: 1;
        }

        .room-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .room-messages::-webkit-scrollbar {
            display: none;
        }

        .msg-container-outer {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .msg-wrapper {
            display: flex;
            width: 100%;
            transition: opacity 0.3s var(--ease-curve);
        }
        .msg-wrapper.received {
            justify-content: flex-start;
        }
        .msg-wrapper.sent {
            justify-content: flex-end;
        }

        .msg-bubble {
            max-width: 75%;
            padding: 12px 18px;
            font-size: 16px;
            line-height: 1.5;
            border-radius: 20px;
            position: relative;
            word-wrap: break-word;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .msg-wrapper.received .msg-bubble {
            background-color: var(--bg-sub);
            color: var(--text-dark);
            border-bottom-left-radius: 4px;
        }
        .msg-wrapper.sent .msg-bubble {
            background-color: var(--apple-blue);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .quoted-msg {
            font-size: 14px;
            color: var(--text-muted);
            background: rgba(0, 0, 0, 0.06);
            padding: 8px 12px;
            border-radius: 12px;
            margin-bottom: 8px;
            border-left: 3px solid var(--apple-blue);
        }
        [data-theme="dark"] .quoted-msg {
            background: rgba(255, 255, 255, 0.15);
            color: var(--text-dark);
        }

        .msg-actions {
            display: none;
            gap: 12px;
            margin-top: 6px;
            padding: 0 12px;
            animation: fadeUp 0.3s var(--ease-curve);
        }
        .msg-container-outer.show-actions .msg-actions {
            display: flex;
        }
        .msg-wrapper.sent+.msg-actions {
            justify-content: flex-end;
        }

        .action-icon-btn {
            background: var(--bg-sub);
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-dark);
            transition: transform 0.2s var(--ease-curve);
        }
        .action-icon-btn:active {
            transform: scale(0.85);
        }

        .input-wrapper-outer {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--line-light);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            padding-bottom: var(--safe-bottom);
        }
        .reply-banner {
            padding: 12px 32px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .reply-text-content {
            font-size: 14px;
            color: var(--text-muted);
            border-left: 3px solid var(--apple-blue);
            padding-left: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .close-reply-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            display: flex;
        }
        .input-area {
            padding: 12px 32px;
            display: flex;
            align-items: flex-end;
            gap: 12px;
        }

        .msg-input {
            flex: 1;
            background: var(--bg-sub);
            border: 1px solid transparent;
            border-radius: 20px;
            padding: 12px 20px;
            font-size: 16px;
            outline: none;
            color: var(--text-dark);
            max-height: 120px;
            overflow-y: auto;
            resize: none;
            font-family: var(--font-en);
            transition: background 0.2s, border-color 0.2s;
        }
        .msg-input:focus {
            border-color: var(--line-light);
            background: var(--bg-paper);
        }

        .send-btn {
            background: var(--apple-blue);
            color: #fff;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s var(--ease-curve);
            flex-shrink: 0;
        }
        .send-btn:active {
            transform: scale(0.9);
        }
        .send-btn:disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 32px;
            color: var(--text-muted);
            text-align: center;
            flex: 1;
        }
        .empty-state svg {
            width: 64px;
            height: 64px;
            stroke: var(--text-muted);
            margin-bottom: 20px;
            opacity: 0.3;
        }
        .empty-state h3 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
        }
        .empty-state p {
            font-size: 15px;
            max-width: 280px;
        }

        .loading-spinner {
            display: flex;
            justify-content: center;
            padding: 40px 0;
        }
        .loading-spinner::after {
            content: '';
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 3px solid var(--bg-sub);
            border-top-color: var(--apple-blue);
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 自適應 textarea 高度 */
        .msg-input::-webkit-scrollbar {
            width: 4px;
        }
        .msg-input::-webkit-scrollbar-thumb {
            background: var(--text-muted);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <svg width="0" height="0" style="display:none;">
        <defs>
            <g id="icon-book"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20" fill="none" stroke-width="2" stroke-linecap="round" /></g>
            <g id="icon-radar"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></g>
            <g id="icon-moment"><path d="M12 2l3 6 6 3-6 3-3 6-3-6-6-3 6-3z" stroke-linejoin="round"/></g>
            <g id="icon-message"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></g>
            <g id="icon-my"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></g>
            <g id="icon-back"><path d="M15 18l-6-6 6-6" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
            <g id="icon-send"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
            <g id="icon-close"><path d="M18 6L6 18M6 6l12 12" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
            <g id="icon-reply"><path d="M3 10h10a5 5 0 0 1 5 5v4M3 10l6-6M3 10l6 6" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
            <g id="icon-trash"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6M5 6l1 14a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-14" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
            <g id="icon-inbox"><path d="M4 4h16v16H4z" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 12h5l2 2h2l2-2h5" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
        </defs>
    </svg>

    <div id="app-section">
        <header class="app-header">
            <h1>Messages</h1>
        </header>

        <div class="main-view" id="chat-list-container">
            <div id="chat-list"></div>
        </div>

        <nav class="bottom-tab-bar">
            <a href="index.html" class="tab-item" onclick="triggerHaptic()">
                <svg viewBox="0 0 24 24"><use href="#icon-book"/></svg>
                <span>Daily</span>
            </a>
            <a href="radar.html" class="tab-item" onclick="triggerHaptic()">
                <svg viewBox="0 0 24 24"><use href="#icon-radar"/></svg>
                <span>Radar</span>
            </a>
            <a href="moment.html" class="tab-item" onclick="triggerHaptic()">
                <svg viewBox="0 0 24 24"><use href="#icon-moment"/></svg>
                <span>Moment</span>
            </a>
            <a href="message.html" class="tab-item active" onclick="triggerHaptic()">
                <svg viewBox="0 0 24 24"><use href="#icon-message"/></svg>
                <span>Message</span>
            </a>
            <a href="my/index.html" class="tab-item" onclick="triggerHaptic()">
                <svg viewBox="0 0 24 24"><use href="#icon-my"/></svg>
                <span>My</span>
            </a>
        </nav>

        <div id="chat-room">
            <header class="room-header">
                <button class="back-btn" onclick="triggerHaptic(); closeChat()">
                    <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor"><use href="#icon-back"/></svg>
                </button>
                <div class="avatar" style="width: 36px; height: 36px; font-size: 14px;" id="room-avatar"></div>
                <div class="room-title" id="room-name">聊天</div>
            </header>

            <div class="room-messages" id="message-container"></div>

            <div class="input-wrapper-outer">
                <div id="reply-banner" class="reply-banner view-hidden">
                    <div class="reply-text-content" id="reply-text-content"></div>
                    <button class="close-reply-btn" onclick="cancelReply()">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor"><use href="#icon-close"/></svg>
                    </button>
                </div>
                <div class="input-area">
                    <textarea class="msg-input" id="chat-input" rows="1" placeholder="Message..."></textarea>
                    <button class="send-btn" id="send-btn" onclick="triggerHaptic(); sendMessage()">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor"><use href="#icon-send"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  CONFIG
        // ============================================================
        const SUPABASE_URL = "https://nhjkhtrgehznhdlqyybs.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_BFkX70SHXwbSmNzE_h7AQg_a1OwKkO_";
        let currentAccessToken = localStorage.getItem('aloka_sb_token') || null;
        let currentUserData = null;

        // 當前聊天狀態
        let currentChatPartner = null; // { id, nickname }
        let replyingToText = "";
        let isSending = false;

        // DOM refs
        const chatListEl = document.getElementById('chat-list');
        const roomEl = document.getElementById('chat-room');
        const roomNameEl = document.getElementById('room-name');
        const roomAvatarEl = document.getElementById('room-avatar');
        const msgContainer = document.getElementById('message-container');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const replyBanner = document.getElementById('reply-banner');
        const replyTextContent = document.getElementById('reply-text-content');

        // ============================================================
        //  UTILITY
        // ============================================================
        function triggerHaptic(duration = 15) {
            if (navigator.vibrate) navigator.vibrate(duration);
        }

        function formatTime(iso) {
            const d = new Date(iso);
            const now = new Date();
            const isToday = d.toDateString() === now.toDateString();
            if (isToday) {
                return d.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
            }
            const isYesterday = new Date(now.setDate(now.getDate() - 1)).toDateString() === d.toDateString();
            if (isYesterday) return '昨天';
            return d.toLocaleDateString('zh-TW', { month: 'short', day: 'numeric' });
        }

        function getInitials(name) {
            if (!name) return '?';
            const parts = name.trim().split(/\s+/);
            if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
            return name.substring(0, 2).toUpperCase();
        }

        function scrollToBottom() {
            setTimeout(() => {
                msgContainer.scrollTop = msgContainer.scrollHeight;
            }, 50);
        }

        // ============================================================
        //  AUTH CHECK (INCREMENTAL FIX - RELATIVE PATHS)
        // ============================================================
        async function checkAuth() {
            if (!currentAccessToken) {
                window.location.href = 'index.html'; // FIX: Removed ../
                return false;
            }
            try {
                const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${currentAccessToken}`
                    }
                });
                if (!res.ok) {
                    localStorage.removeItem('aloka_sb_token');
                    window.location.href = 'index.html'; // FIX: Removed ../
                    return false;
                }
                currentUserData = await res.json();
                return true;
            } catch (_) {
                localStorage.removeItem('aloka_sb_token');
                window.location.href = 'index.html'; // FIX: Removed ../
                return false;
            }
        }

        // ============================================================
        //  FETCH HELPERS
        // ============================================================
        async function supabaseFetch(path, options = {}) {
            const url = `${SUPABASE_URL}${path}`;
            const headers = {
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': `Bearer ${currentAccessToken}`,
                'Content-Type': 'application/json',
                ...options.headers
            };
            const res = await fetch(url, { ...options, headers });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
        }

        // 獲取所有 profiles (用於顯示名稱)
        async function fetchAllProfiles() {
            try {
                return await supabaseFetch('/rest/v1/profiles?select=id,nickname');
            } catch (_) { return []; }
        }

        // 獲取與當前用戶相關的消息
        async function fetchUserMessages() {
            if (!currentUserData) return [];
            try {
                // 獲取當前用戶發送的和接收的消息
                const sent = await supabaseFetch(
                    `/rest/v1/messages?select=*&sender_id=eq.${currentUserData.id}&order=created_at.desc`
                );
                // 注意：receiver_name 是名稱，不是 id，所以無法精確過濾 receiver_id
                // 我們只能獲取所有消息，然後在客戶端過濾
                const all = await supabaseFetch('/rest/v1/messages?select=*&order=created_at.desc&limit=500');
                // 過濾：當前用戶發送的 或 接收者名稱包含當前用戶的暱稱（簡化方案）
                const currentNick = currentUserData.user_metadata?.nickname || currentUserData.email?.split('@')[0] || '';
                const filtered = all.filter(m =>
                    m.sender_id === currentUserData.id ||
                    (m.receiver_name && m.receiver_name.toLowerCase() === currentNick.toLowerCase())
                );
                return filtered;
            } catch (_) { return []; }
        }

        // 獲取與特定用戶的歷史消息
        async function fetchChatHistory(partnerId, partnerName) {
            if (!currentUserData) return [];
            try {
                const all = await supabaseFetch('/rest/v1/messages?select=*&order=created_at.asc&limit=500');
                // 過濾：與該夥伴相關的消息
                const currentNick = currentUserData.user_metadata?.nickname || currentUserData.email?.split('@')[0] || '';
                const partnerNick = partnerName || partnerId;
                return all.filter(m => {
                    const isFromMe = m.sender_id === currentUserData.id;
                    const isToMe = m.receiver_name && m.receiver_name.toLowerCase() === currentNick.toLowerCase();
                    const isToPartner = m.receiver_name && m.receiver_name.toLowerCase() === partnerNick.toLowerCase();
                    const isFromPartner = m.sender_id === partnerId;
                    // 我發給 partner 或 partner 發給我
                    if (isFromMe && isToPartner) return true;
                    if (isFromPartner && isToMe) return true;
                    return false;
                });
            } catch (_) { return []; }
        }

        // ============================================================
        //  RENDER: 對話列表
        // ============================================================
        async function renderChatList() {
            if (!currentUserData) return;
            chatListEl.innerHTML = '<div class="loading-spinner"></div>';

            try {
                const profiles = await fetchAllProfiles();
                const profileMap = {};
                profiles.forEach(p => { profileMap[p.id] = p.nickname || p.id; });

                const messages = await fetchUserMessages();
                const currentNick = currentUserData.user_metadata?.nickname || currentUserData.email?.split('@')[0] || '';

                // 構建對話分組
                const conversations = new Map();

                messages.forEach(msg => {
                    let partnerId = null;
                    let partnerName = null;

                    if (msg.sender_id === currentUserData.id) {
                        // 我發送的 → 對方是 receiver_name
                        partnerName = msg.receiver_name || 'Unknown';
                        // 嘗試從 profiles 找 id
                        for (const [id, name] of Object.entries(profileMap)) {
                            if (name.toLowerCase() === partnerName.toLowerCase()) {
                                partnerId = id;
                                break;
                            }
                        }
                    } else {
                        // 別人發送的 → 對方是 sender_id
                        partnerId = msg.sender_id;
                        partnerName = profileMap[partnerId] || partnerId;
                    }

                    if (!partnerName) partnerName = 'Unknown';
                    const key = partnerId || partnerName;

                    if (!conversations.has(key)) {
                        conversations.set(key, {
                            partnerId: partnerId,
                            partnerName: partnerName,
                            lastMsg: msg,
                            unread: 0,
                            messages: []
                        });
                    }
                    const conv = conversations.get(key);
                    conv.messages.push(msg);
                    // 更新最新消息（按時間）
                    if (new Date(msg.created_at) > new Date(conv.lastMsg.created_at)) {
                        conv.lastMsg = msg;
                    }
                    // 未讀：對方發送且當前用戶未讀（簡化：未讀計數為對方發送的消息數）
                    if (msg.sender_id !== currentUserData.id) {
                        conv.unread += 1;
                    }
                });

                // 轉為陣列並按最新消息排序
                const convList = Array.from(conversations.values());
                convList.sort((a, b) => new Date(b.lastMsg.created_at) - new Date(a.lastMsg.created_at));

                if (convList.length === 0) {
                    chatListEl.innerHTML = `
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24"><use href="#icon-inbox"/></svg>
                            <h3>No messages yet</h3>
                            <p>Start a conversation with someone from the Radar.</p>
                        </div>
                    `;
                    return;
                }

                // 渲染列表
                chatListEl.innerHTML = '';
                convList.forEach(conv => {
                    const item = document.createElement('div');
                    item.className = 'chat-list-item';
                    const avatar = document.createElement('div');
                    avatar.className = 'avatar';
                    avatar.textContent = getInitials(conv.partnerName);
                    avatar.style.backgroundColor = stringToColor(conv.partnerName);

                    const info = document.createElement('div');
                    info.className = 'chat-info';

                    const header = document.createElement('div');
                    header.className = 'chat-header';
                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'chat-name';
                    nameSpan.textContent = conv.partnerName;
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'chat-time';
                    timeSpan.textContent = formatTime(conv.lastMsg.created_at);
                    header.appendChild(nameSpan);
                    header.appendChild(timeSpan);

                    const preview = document.createElement('div');
                    preview.className = 'chat-preview';
                    preview.textContent = conv.lastMsg.content || '';

                    info.appendChild(header);
                    info.appendChild(preview);

                    item.appendChild(avatar);
                    item.appendChild(info);

                    if (conv.unread > 0) {
                        const badge = document.createElement('span');
                        badge.className = 'unread-badge';
                        badge.textContent = conv.unread > 9 ? '9+' : conv.unread;
                        item.appendChild(badge);
                    }

                    item.addEventListener('click', () => {
                        triggerHaptic();
                        openChat(conv.partnerName, conv.partnerId);
                    });

                    chatListEl.appendChild(item);
                });

            } catch (_) {
                chatListEl.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24"><use href="#icon-inbox"/></svg>
                        <h3>Unable to load</h3>
                        <p>Please try again later.</p>
                    </div>
                `;
            }
        }

        // 簡單顏色生成
        function stringToColor(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            const hue = Math.abs(hash % 360);
            return `hsl(${hue}, 60%, 75%)`;
        }

        // ============================================================
        //  CHAT ROOM
        // ============================================================
        function openChat(partnerName, partnerId = null) {
            // 關閉所有打開的 action
            document.querySelectorAll('.msg-container-outer.show-actions').forEach(el => el.classList.remove('show-actions'));

            currentChatPartner = { id: partnerId, nickname: partnerName };
            roomNameEl.textContent = partnerName || '聊天';
            roomAvatarEl.textContent = getInitials(partnerName || '');
            roomAvatarEl.style.backgroundColor = stringToColor(partnerName || '');

            // 清空訊息容器，顯示加載中
            msgContainer.innerHTML = '<div class="loading-spinner"></div>';
            roomEl.classList.add('open');

            // 載入歷史消息
            loadChatHistory(partnerId, partnerName).then(() => {
                scrollToBottom();
            });

            // 聚焦輸入框
            setTimeout(() => chatInput.focus(), 300);
        }

        async function loadChatHistory(partnerId, partnerName) {
            try {
                const history = await fetchChatHistory(partnerId, partnerName);
                msgContainer.innerHTML = '';
                if (history.length === 0) {
                    // 顯示空狀態
                    const empty = document.createElement('div');
                    empty.className = 'empty-state';
                    empty.style.padding = '40px 0';
                    empty.innerHTML = `
                        <svg viewBox="0 0 24 24" style="width:48px;height:48px;"><use href="#icon-inbox"/></svg>
                        <h3>No messages yet</h3>
                        <p>Say hello to ${partnerName || 'your friend'}!</p>
                    `;
                    msgContainer.appendChild(empty);
                    return;
                }

                history.forEach(msg => {
                    const isFromMe = msg.sender_id === currentUserData.id;
                    const type = isFromMe ? 'sent' : 'received';
                    const content = msg.content || '';
                    // 如果有 quote 字段（擴展），可顯示，但此處忽略
                    appendMessageToRoom(type, content, '');
                });

                // 如果有新消息，滾到底部
                scrollToBottom();
            } catch (_) {
                msgContainer.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" style="width:48px;height:48px;"><use href="#icon-inbox"/></svg>
                        <h3>Unable to load history</h3>
                        <p>Please try again.</p>
                    </div>
                `;
            }
        }

        // ============================================================
        //  CLOSE CHAT (INCREMENTAL FIX - URL PARAMS)
        // ============================================================
        function closeChat() {
            roomEl.classList.remove('open');
            chatInput.value = '';
            chatInput.style.height = 'auto';
            cancelReply();
            document.querySelectorAll('.msg-container-outer.show-actions').forEach(el => el.classList.remove('show-actions'));
            currentChatPartner = null;

            // FIX: 無痕清除 URL 參數，避免重整後再次自動打開
            if (window.location.search.includes('chat_with')) {
                window.history.replaceState(null, '', window.location.pathname);
            }
        }

        // ============================================================
        //  MESSAGE RENDER
        // ============================================================
        function appendMessageToRoom(type, text, quote = "") {
            const outer = document.createElement('div');
            outer.className = 'msg-container-outer';
            const id = 'msg-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
            outer.id = id;

            const wrapper = document.createElement('div');
            wrapper.className = `msg-wrapper ${type}`;

            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble';
            bubble.onclick = () => toggleActions(outer);

            if (quote) {
                const qEl = document.createElement('div');
                qEl.className = 'quoted-msg';
                qEl.textContent = quote;
                bubble.appendChild(qEl);
            }

            const tEl = document.createElement('div');
            tEl.textContent = text;
            bubble.appendChild(tEl);

            wrapper.appendChild(bubble);
            outer.appendChild(wrapper);

            // Actions
            const actions = document.createElement('div');
            actions.className = 'msg-actions';

            const replyBtn = document.createElement('button');
            replyBtn.className = 'action-icon-btn';
            replyBtn.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor"><use href="#icon-reply"/></svg>';
            replyBtn.onclick = (e) => {
                e.stopPropagation();
                handleReply(text, outer);
            };
            actions.appendChild(replyBtn);

            if (type === 'sent') {
                const retractBtn = document.createElement('button');
                retractBtn.className = 'action-icon-btn';
                retractBtn.innerHTML =
                    '<svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor"><use href="#icon-trash"/></svg>';
                retractBtn.onclick = (e) => {
                    e.stopPropagation();
                    handleRetract(id);
                };
                actions.appendChild(retractBtn);
            }

            outer.appendChild(actions);
            msgContainer.appendChild(outer);

            // 如果是第一條消息，移除空狀態
            const emptyState = msgContainer.querySelector('.empty-state');
            if (emptyState) emptyState.remove();
        }

        function toggleActions(outerEl) {
            triggerHaptic(10);
            document.querySelectorAll('.msg-container-outer.show-actions').forEach(el => {
                if (el !== outerEl) el.classList.remove('show-actions');
            });
            outerEl.classList.toggle('show-actions');
        }

        function handleReply(text, outerEl) {
            triggerHaptic(15);
            replyingToText = text;
            replyBanner.classList.remove('view-hidden');
            replyTextContent.textContent = text;
            outerEl.classList.remove('show-actions');
            chatInput.focus();
        }

        function cancelReply() {
            triggerHaptic(10);
            replyingToText = "";
            replyBanner.classList.add('view-hidden');
            replyTextContent.textContent = "";
        }

        function handleRetract(id) {
            triggerHaptic(20);
            const el = document.getElementById(id);
            if (el) {
                el.style.opacity = '0';
                el.style.transition = 'opacity 0.3s';
                setTimeout(() => {
                    if (el.parentNode) el.remove();
                }, 300);
            }
        }

        // ============================================================
        //  SEND MESSAGE
        // ============================================================
        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text || isSending || !currentChatPartner) return;
            if (!currentUserData) return;

            isSending = true;
            sendBtn.disabled = true;

            const replyQuote = replyingToText;

            // 先顯示在 UI 上
            appendMessageToRoom('sent', text, replyQuote);
            chatInput.value = '';
            chatInput.style.height = 'auto';
            cancelReply();
            scrollToBottom();

            // 保存到 Supabase
            try {
                const payload = {
                    sender_id: currentUserData.id,
                    receiver_name: currentChatPartner.nickname || 'Unknown',
                    content: text,
                    created_at: new Date().toISOString()
                };
                // 如果有 quote，可存為額外字段（但表結構沒有，忽略）
                await supabaseFetch('/rest/v1/messages', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                // 成功後，可更新列表（但此處不重新加載全部，保持輕量）
                // 未來可考慮添加 WebSocket 或輪詢
            } catch (err) {
                console.warn('Send message failed:', err);
                // 顯示錯誤提示（簡化）
                const notice = document.createElement('div');
                notice.style.cssText =
                    'text-align:center;font-size:13px;color:var(--text-muted);padding:8px;background:var(--bg-sub);border-radius:12px;margin-top:4px;';
                notice.textContent = '⚠️ 訊息發送失敗，請重試';
                msgContainer.appendChild(notice);
                setTimeout(() => notice.remove(), 3000);
            }

            isSending = false;
            sendBtn.disabled = false;
        }

        // ============================================================
        //  AUTO OPEN FROM RADAR
        // ============================================================
        async function handleAutoOpen() {
            const params = new URLSearchParams(window.location.search);
            const targetId = params.get('chat_with');
            if (!targetId) return;

            try {
                // 獲取對方暱稱
                const profiles = await fetchAllProfiles();
                const profile = profiles.find(p => p.id === targetId);
                const name = profile ? profile.nickname : targetId;
                // 延遲一下確保列表已加載
                setTimeout(() => {
                    openChat(name, targetId);
                }, 300);
            } catch (_) {
                // 如果失敗，嘗試直接用 id 打開
                setTimeout(() => {
                    openChat(targetId, targetId);
                }, 300);
            }
        }

        // ============================================================
        //  KEYBOARD SHORTCUTS & MOBILE FIX
        // ============================================================
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        chatInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        // 點擊外部關閉 action
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.msg-container-outer') && !e.target.closest('.action-icon-btn')) {
                document.querySelectorAll('.msg-container-outer.show-actions').forEach(el => el.classList.remove('show-actions'));
            }
        });

        // FIX: 動態適配手機虛擬鍵盤高度，避免輸入框被推移出畫面
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => {
                document.body.style.height = window.visualViewport.height + 'px';
            });
        }

        // ============================================================
        //  INIT
        // ============================================================
        async function init() {
            const ok = await checkAuth();
            if (!ok) return;

            // 加載對話列表
            await renderChatList();

            // 自動打開（從 radar 跳轉）
            await handleAutoOpen();

            // 主題跟隨系統
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
                document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
            });
        }

        // 啟動
        init().catch(() => {
            // fallback
        });
    </script>
</body>
</html>
