<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0" />
    <title>Moment · Candlelight Aloka</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        /* ===== 基礎變量 ===== */
        :root {
            --bg-paper: #ffffff;
            --bg-sub: #f5f5f7;
            --text-dark: #1d1d1f;
            --text-muted: #86868b;
            --line-light: rgba(0, 0, 0, 0.06);
            --apple-blue: #007AFF;
            --apple-blue-light: #E5F1FF;
            --error-color: #ff3b30;
            --success-color: #34c759;
            --radius: 20px;
            --safe-bottom: env(safe-area-inset-bottom, 20px);
            --safe-top: env(safe-area-inset-top, 40px);
            --ease-curve: cubic-bezier(0.32, 0.72, 0, 1);
            --font-en: 'Inter', -apple-system, sans-serif;
            --font-tc: 'Noto Sans TC', 'PingFang TC', sans-serif;
            --glass-bg: rgba(245, 245, 247, 0.85);
            --tab-height: 68px;
            /* 導航欄高度（含安全區域） */
            --tab-total: calc(var(--tab-height) + var(--safe-bottom));
        }

        [data-theme="dark"] {
            --bg-paper: #000000;
            --bg-sub: #1c1c1e;
            --text-dark: #f5f5f7;
            --text-muted: #8e8e93;
            --line-light: rgba(255, 255, 255, 0.1);
            --apple-blue-light: #0A2948;
            --glass-bg: rgba(28, 28, 30, 0.85);
        }

        /* ===== 重置 ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-en), var(--font-tc);
            background-color: var(--bg-sub);
            color: var(--text-dark);
            -webkit-font-smoothing: antialiased;
            text-align: left;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            letter-spacing: 0.01em;
            transition: background-color 0.4s var(--ease-curve), color 0.4s var(--ease-curve);
            /* 防止滾動穿透 */
            overscroll-behavior: none;
        }

        .view-hidden {
            display: none !important;
        }

        /* ===== 主容器 ===== */
        #app-section {
            display: flex;
            flex-direction: column;
            height: 100%;
            height: 100dvh;
            max-width: 100%;
            margin: 0 auto;
            background: var(--bg-sub);
            position: relative;
            overflow: hidden;
            animation: appStageIn 0.8s var(--ease-curve);
        }

        @media (min-width: 600px) {
            #app-section {
                max-width: 600px;
                border-left: 1px solid var(--line-light);
                border-right: 1px solid var(--line-light);
            }
        }

        @keyframes appStageIn {
            from {
                opacity: 0;
                transform: scale(0.98) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* ===== 頂部標頭 ===== */
        .app-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            padding: calc(var(--safe-top) + 24px) 24px 20px;
            /* 減少頂部空間，讓內容更多 */
            background: var(--bg-sub);
            flex-shrink: 0;
            position: relative;
            z-index: 10;
        }

        .app-header-left {
            text-align: left;
        }

        .app-header h1 {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.8px;
            line-height: 1.1;
            margin-bottom: 4px;
        }

        .live-clock {
            font-family: var(--font-en);
            font-size: 13px;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-actions button {
            background: var(--apple-blue);
            color: white;
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.3s var(--ease-curve), box-shadow 0.3s var(--ease-curve);
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
            flex-shrink: 0;
        }

        .header-actions button:active {
            transform: scale(0.88);
            box-shadow: 0 2px 6px rgba(0, 122, 255, 0.2);
        }

        /* ===== 主內容區（可滾動） ===== */
        .main-view {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px calc(var(--tab-total) + 32px);
            /* 確保內容不被底部導航欄遮擋 */
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }

        .main-view::-webkit-scrollbar {
            display: none;
        }

        /* ===== 動態卡片（雜誌風格） ===== */
        .moment-card {
            background: var(--bg-paper);
            padding: 28px 24px;
            color: var(--text-dark);
            border-radius: 20px;
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--line-light);
            text-align: left;
            position: relative;
            transition: transform 0.3s var(--ease-curve), box-shadow 0.3s var(--ease-curve);
        }

        .moment-card:active {
            transform: scale(0.99);
        }

        [data-theme="dark"] .moment-card {
            background: #1c1c1e;
            color: #f5f5f7;
            border-color: rgba(255, 255, 255, 0.08);
        }

        .moment-header {
            border-bottom: 2px solid var(--text-dark);
            padding-bottom: 12px;
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 8px;
        }

        .moment-brand {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            line-height: 1.4;
        }

        .moment-brand span {
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0;
            color: var(--text-muted);
            display: block;
            margin-top: 2px;
        }

        .moment-date {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .moment-meta-row {
            display: flex;
            gap: 14px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .moment-meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .moment-meta-item svg {
            flex-shrink: 0;
        }

        .moment-story {
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 24px;
            color: var(--text-dark);
            font-weight: 400;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .moment-story-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.3px;
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap;
        }

        .moment-story-author {
            font-size: 14px;
            font-weight: 500;
            color: var(--apple-blue);
        }

        .moment-story-subtitle {
            font-size: 17px;
            font-weight: 600;
            margin: 20px 0 10px;
            color: var(--text-dark);
        }

        .moment-footer {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--line-light);
            padding-top: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .moment-ip {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .like-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: color 0.3s;
            background: none;
            border: none;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            padding: 4px 8px;
            border-radius: 12px;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .like-btn:active {
            transform: scale(0.92);
        }

        .like-btn.liked {
            color: var(--error-color);
        }

        .like-btn svg {
            transition: transform 0.3s var(--ease-curve);
            fill: transparent;
            stroke: currentColor;
            width: 20px;
            height: 20px;
        }

        .like-btn.liked svg {
            fill: var(--error-color);
            stroke: var(--error-color);
        }

        .like-btn:active svg {
            transform: scale(0.7);
        }

        /* ===== 模態框 ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 200;
            display: none;
            align-items: flex-end;
            opacity: 0;
            transition: opacity 0.45s var(--ease-curve);
        }

        .modal-overlay.open {
            display: flex;
            opacity: 1;
        }

        .modal-sheet {
            background: var(--bg-paper);
            border-radius: 28px 28px 0 0;
            width: 100%;
            max-width: 600px;
            height: 92dvh;
            /* 保留頂部空間，讓用戶能看到背景 */
            max-height: 92dvh;
            padding: calc(var(--safe-top) + 52px) 24px calc(32px + var(--safe-bottom));
            /* ✅ 底部加入安全區域 */
            overflow-y: auto;
            margin: 0 auto;
            transform: translateY(100%);
            transition: transform 0.55s var(--ease-curve);
            position: relative;
            scroll-behavior: smooth;
            text-align: left;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
        }

        .modal-sheet::-webkit-scrollbar {
            display: none;
        }

        .modal-overlay.open .modal-sheet {
            transform: translateY(0);
        }

        /* 關閉按鈕 */
        .modal-close-btn {
            position: sticky;
            top: calc(var(--safe-top) + 12px);
            float: right;
            background: var(--bg-sub);
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s var(--ease-curve);
            z-index: 10;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .modal-close-btn:active {
            transform: scale(0.85);
            background: var(--line-light);
        }

        /* ===== 表單元件 ===== */
        .form-input {
            width: 100%;
            background: var(--bg-sub);
            border: 1.5px solid transparent;
            padding: 16px 18px;
            border-radius: 16px;
            font-size: 16px;
            outline: none;
            color: var(--text-dark);
            margin-bottom: 18px;
            transition: all 0.35s var(--ease-curve);
            font-family: var(--font-en), var(--font-tc);
            -webkit-appearance: none;
            appearance: none;
        }

        .form-input:focus {
            border-color: var(--apple-blue);
            background: var(--bg-paper);
            box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.12);
        }

        .form-input::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
        }

        textarea.form-input {
            resize: vertical;
            min-height: 100px;
            line-height: 1.7;
        }

        /* ===== 按鈕 ===== */
        .btn-primary,
        .btn-secondary {
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            padding: 16px 20px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.35s var(--ease-curve);
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-family: var(--font-en), var(--font-tc);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            border: none;
        }

        .btn-primary {
            color: #ffffff;
            background: var(--apple-blue);
            box-shadow: 0 4px 14px rgba(0, 122, 255, 0.25);
        }

        .btn-primary:active {
            transform: scale(0.95);
            box-shadow: 0 2px 8px rgba(0, 122, 255, 0.15);
        }

        .btn-secondary {
            color: var(--text-dark);
            background: transparent;
            border: 1.5px solid var(--line-light);
        }

        .btn-secondary:active {
            transform: scale(0.95);
            background: var(--line-light);
        }

        .btn-primary:disabled,
        .btn-secondary:disabled {
            opacity: 0.6;
            transform: none !important;
        }

        /* ===== 精靈步驟 ===== */
        .wizard-step {
            display: none;
            animation: fadeUp 0.5s var(--ease-curve);
            min-height: 100%;
            flex-direction: column;
            text-align: left;
            padding-bottom: 20px;
        }

        .wizard-step.active {
            display: flex;
        }

        .wizard-header {
            margin-bottom: 28px;
        }

        .wizard-meta {
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .wizard-title {
            font-size: 28px;
            font-weight: 700;
            line-height: 1.3;
            letter-spacing: -0.4px;
        }

        .wizard-title small {
            font-family: var(--font-tc);
            display: block;
            font-size: 15px;
            color: var(--text-muted);
            margin-top: 6px;
            font-weight: 400;
            letter-spacing: 0;
        }

        .selector-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .option-btn {
            background: var(--bg-sub);
            border: 1.5px solid transparent;
            padding: 16px 18px;
            border-radius: 18px;
            cursor: pointer;
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 12px;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.35s var(--ease-curve);
            width: calc(50% - 6px);
            text-align: left;
            font-family: var(--font-en), var(--font-tc);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .option-btn svg {
            width: 26px;
            height: 26px;
            stroke: var(--text-muted);
            transition: all 0.35s var(--ease-curve);
            flex-shrink: 0;
        }

        .option-btn:active {
            transform: scale(0.94);
        }

        .option-btn.selected {
            background: var(--apple-blue-light);
            border-color: var(--apple-blue);
            color: var(--apple-blue);
        }

        .option-btn.selected svg {
            stroke: var(--apple-blue);
        }

        .option-btn.loc-btn {
            width: 100%;
            flex-direction: row;
            align-items: center;
            gap: 14px;
        }

        /* ===== 溫度滑塊 ===== */
        .temp-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: var(--line-light);
            outline: none;
            margin: 32px 0 24px;
            transition: background 0.3s;
        }

        .temp-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--bg-paper);
            border: 2px solid var(--apple-blue);
            cursor: pointer;
            transition: transform 0.3s var(--ease-curve), box-shadow 0.3s;
            box-shadow: 0 2px 12px rgba(0, 122, 255, 0.25);
        }

        .temp-slider::-webkit-slider-thumb:active {
            transform: scale(0.8);
        }

        .temp-slider::-moz-range-thumb {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--bg-paper);
            border: 2px solid var(--apple-blue);
            cursor: pointer;
        }

        .temp-display {
            font-size: 52px;
            font-weight: 700;
            margin-bottom: 4px;
            font-variant-numeric: tabular-nums;
            letter-spacing: -2px;
            line-height: 1;
        }

        .temp-feeling {
            font-size: 15px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }

        /* ===== 精靈底部按鈕 ===== */
        .wizard-footer {
            margin-top: auto;
            padding-top: 24px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .wizard-footer .btn-primary,
        .wizard-footer .btn-secondary {
            flex: 1;
            min-width: 100px;
        }

        /* ===== 底部導航欄 ===== */
        .bottom-tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: calc(var(--tab-height) + var(--safe-bottom));
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid var(--line-light);
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
            padding-top: 10px;
            padding-bottom: var(--safe-bottom);
            z-index: 100;
            max-width: 600px;
            margin: 0 auto;
            left: 50%;
            transform: translateX(-50%);
        }

        @media (min-width: 600px) {
            .bottom-tab-bar {
                left: 50%;
                transform: translateX(-50%);
                border-left: 1px solid var(--line-light);
                border-right: 1px solid var(--line-light);
            }
        }

        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-muted);
            gap: 4px;
            transition: color 0.35s var(--ease-curve), transform 0.35s var(--ease-curve);
            width: 20%;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            border: none;
            background: none;
            font-family: var(--font-en), var(--font-tc);
            padding: 0;
        }

        .tab-item.active {
            color: var(--text-dark);
        }

        .tab-item:active {
            transform: scale(0.88);
        }

        .tab-item svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .tab-item span {
            font-size: 9.5px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        /* ===== 動畫 ===== */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== 響應式 ===== */
        @media (max-width: 420px) {
            .app-header {
                padding: calc(var(--safe-top) + 16px) 16px 14px;
            }

            .app-header h1 {
                font-size: 26px;
            }

            .header-actions button {
                width: 42px;
                height: 42px;
            }

            .main-view {
                padding: 0 14px calc(var(--tab-total) + 24px);
            }

            .moment-card {
                padding: 20px 16px;
                border-radius: 16px;
                margin-bottom: 16px;
            }

            .moment-story-title {
                font-size: 19px;
            }

            .moment-story {
                font-size: 15px;
            }

            .moment-meta-row {
                gap: 10px;
            }

            .moment-meta-item {
                font-size: 11.5px;
            }

            .modal-sheet {
                padding: calc(var(--safe-top) + 40px) 16px calc(24px + var(--safe-bottom));
                border-radius: 20px 20px 0 0;
            }

            .wizard-title {
                font-size: 24px;
            }

            .option-btn {
                padding: 14px 14px;
                font-size: 14px;
                width: calc(50% - 6px);
            }

            .temp-display {
                font-size: 44px;
            }

            .btn-primary,
            .btn-secondary {
                font-size: 15px;
                padding: 14px 16px;
            }

            .modal-close-btn {
                width: 36px;
                height: 36px;
                top: calc(var(--safe-top) + 8px);
            }
        }

        @media (max-width: 360px) {
            .option-btn {
                width: 100%;
            }

            .moment-meta-row {
                gap: 8px;
            }

            .moment-meta-item {
                font-size: 10.5px;
            }

            .moment-card {
                padding: 16px 12px;
            }
        }

        /* ===== 工具類 ===== */
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .gap-8 {
            gap: 8px;
        }

        .gap-12 {
            gap: 12px;
        }

        .mt-16 {
            margin-top: 16px;
        }

        .mb-8 {
            margin-bottom: 8px;
        }

        .text-muted {
            color: var(--text-muted);
        }

        /* ===== Toast 提示 ===== */
        .toast-container {
            position: fixed;
            top: calc(var(--safe-top) + 20px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            max-width: 90%;
            width: 400px;
            pointer-events: none;
        }

        .toast {
            background: var(--bg-paper);
            color: var(--text-dark);
            padding: 14px 20px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            border: 1px solid var(--line-light);
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            margin-bottom: 8px;
            animation: toastIn 0.4s var(--ease-curve);
            pointer-events: auto;
            backdrop-filter: blur(8px);
        }

        .toast.error {
            border-left: 4px solid var(--error-color);
        }

        .toast.success {
            border-left: 4px solid var(--success-color);
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(-20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ===== 加載佔位 ===== */
        .loading-placeholder {
            color: var(--text-muted);
            font-size: 15px;
            text-align: left;
            padding: 40px 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .loading-placeholder::after {
            content: '';
            width: 18px;
            height: 18px;
            border: 2px solid var(--text-muted);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== 空狀態 ===== */
        .empty-state {
            color: var(--text-muted);
            font-size: 15px;
            text-align: center;
            padding: 60px 20px;
            line-height: 1.8;
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            stroke: var(--text-muted);
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* ===== 滾動條美化（可選） ===== */
        .modal-sheet {
            scrollbar-width: thin;
            scrollbar-color: var(--line-light) transparent;
        }

        .modal-sheet::-webkit-scrollbar {
            width: 4px;
        }

        .modal-sheet::-webkit-scrollbar-track {
            background: transparent;
        }

        .modal-sheet::-webkit-scrollbar-thumb {
            background: var(--line-light);
            border-radius: 4px;
        }
    </style>
</head>

    <!-- ===== Toast 容器 ===== -->

    <script>
        // ============================================================
        // 配置
        // ============================================================
        const SUPABASE_URL = "https://nhjkhtrgehznhdlqyybs.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_BFkX70SHXwbSmNzE_h7AQg_a1OwKkO_";
        let currentAccessToken = localStorage.getItem('aloka_sb_token') || null;
        let studentUserId = "";
        let currentClientIP = "Unknown IP";

        // 表單數據
        let entryData = {
            mood: 'happy',
            customMood: '',
            temp: '22',
            customTempDesc: '',
            tempDesc: '舒適',
            weather: 'Sunny',
            customWeather: '',
            location: 'Outside',
            content: ''
        };

        // 本地點讚緩存
        let localLikes = {};
        let likeThrottle = {};

        // ============================================================
        // 工具函數
        // ============================================================
        function triggerHaptic(duration = 12) {
            if (navigator.vibrate) navigator.vibrate(duration);
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-12px)';
                setTimeout(() => toast.remove(), 400);
            }, 2800);
        }

        function getSvgContent(id) {
            const el = document.getElementById('icon-' + id);
            return el ? el.innerHTML : '';
        }

        function scrollToBottom(container) {
            setTimeout(() => {
                const el = container || document.querySelector('.modal-sheet');
                if (el) el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' });
            }, 80);
        }

        // ============================================================
        // 時鐘
        // ============================================================
        function updateClock() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            const h = String(now.getHours()).padStart(2, '0');
            const min = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            const clockEl = document.getElementById('live-clock');
            if (clockEl) clockEl.innerText = `${y}年${m}月${d}日 ${h}:${min}:${s}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ============================================================
        // 認證 & 加載動態
        // ============================================================
        window.onload = async () => {
            fetchClientIP();
            if (!currentAccessToken) {
                window.location.href = 'index.html';
                return;
            }
            try {
                const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${currentAccessToken}` }
                });
                if (res.ok) {
                    studentUserId = (await res.json()).id;
                    fetchMoments();
                } else {
                    localStorage.removeItem('aloka_sb_token');
                    window.location.href = 'index.html';
                }
            } catch (e) {
                showToast('連線異常，請重新登入', 'error');
            }
        };

        async function fetchClientIP() {
            try {
                const ipRes = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipRes.json();
                currentClientIP = ipData.ip || "Unknown IP";
            } catch (_) { /* 靜默失敗 */ }
        }

        // ============================================================
        // 渲染動態列表
        // ============================================================
        async function fetchMoments() {
            const container = document.getElementById('feed-container');
            container.innerHTML = `<div class="loading-placeholder">載入動態中…</div>`;
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/moments?select=*&order=date.desc`, {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${currentAccessToken}` }
                });
                if (!res.ok) throw new Error('Fetch failed');
                const data = await res.json();
                renderFeed(data);
            } catch (e) {
                console.warn(e);
                container.innerHTML =
                    `<div class="empty-state"><svg viewBox="0 0 24 24" stroke="currentColor"><use href="#icon-empty"/></svg><br>載入失敗，請重新整理</div>`;
            }
        }

        function renderFeed(data) {
            const container = document.getElementById('feed-container');
            if (data.length === 0) {
                container.innerHTML =
                    `<div class="empty-state"><svg viewBox="0 0 24 24" stroke="currentColor"><use href="#icon-empty"/></svg><br>還沒有動態，來發佈第一篇吧！</div>`;
                return;
            }

            container.innerHTML = '';
            data.forEach(entry => {
                const d = new Date(entry.date);
                const dateDisplay = isNaN(d) ? entry.date :
                    `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;

                let contentHTML = '';
                let nickname = "Anonymous";
                try {
                    const parsed = JSON.parse(entry.content);
                    nickname = parsed.nickname || "Anonymous";
                    if (parsed.title) contentHTML += `<div class="moment-story-title">${escHtml(parsed.title)}</div>`;
                    if (parsed.blocks) {
                        parsed.blocks.forEach(b => {
                            if (b.type === 'subtitle') contentHTML +=
                                `<div class="moment-story-subtitle">${escHtml(b.text)}</div>`;
                            else if (b.type === 'body') contentHTML +=
                                `<div class="moment-story">${escHtml(b.text)}</div>`;
                        });
                    }
                } catch (_) {
                    contentHTML = `<div class="moment-story">${escHtml(entry.content)}</div>`;
                }

                const weatherMap = { 'Sunny': 'sun', 'Cloudy': 'cloud', 'Rainy': 'rain', 'custom': 'gear' };
                const mIcon = (entry.mood === 'custom' || !entry.mood) ? 'gear' : entry.mood;
                const wIcon = weatherMap[entry.weather] || 'sun';
                const ipDisplay = entry.ip_address || "Unknown IP";
                const likesCount = entry.likes_count || 0;
                const isLiked = localLikes[entry.id] || false;

                const card = document.createElement('div');
                card.className = 'moment-card';
                card.innerHTML = `
                        <div class="moment-header">
                            <div class="moment-brand">Moments <br><span>CANDLELIGHT ALOKA</span></div>
                            <div class="moment-date">${dateDisplay}</div>
                        </div>
                        <div class="moment-meta-row">
                            <div class="moment-meta-item"><svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor">${getSvgContent(mIcon)}</svg> <span>${escHtml(entry.mood || '—')}</span></div>
                            <div class="moment-meta-item"><svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor">${getSvgContent('thermometer')}</svg> <span>${entry.temperature || entry.temp || '—'}°C</span></div>
                            <div class="moment-meta-item"><svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor">${getSvgContent(wIcon)}</svg> <span>${escHtml(entry.weather || '—')}</span></div>
                            ${entry.location ? `<div class="moment-meta-item"><svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor">${getSvgContent('location')}</svg> <span>${escHtml(entry.location)}</span></div>` : ''}
                        </div>
                        <div style="margin-bottom:18px; font-size:13px; color:var(--apple-blue); font-weight:600;">@${escHtml(nickname)}</div>
                        ${contentHTML}
                        <div class="moment-footer">
                            <div class="moment-ip">
                                <svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor">${getSvgContent('globe')}</svg>
                                ${escHtml(ipDisplay)}
                            </div>
                            <button class="like-btn ${isLiked ? 'liked' : ''}" id="like-btn-${entry.id}" data-id="${entry.id}" onclick="triggerHaptic(); toggleLike('${entry.id}')">
                                <svg width="20" height="20" viewBox="0 0 24 24">${getSvgContent('heart')}</svg>
                                <span id="like-count-${entry.id}">${likesCount}</span>
                            </button>
                        </div>
                    `;
                container.appendChild(card);

                // 恢復本地點讚狀態
                if (isLiked) {
                    const btn = document.getElementById(`like-btn-${entry.id}`);
                    if (btn) btn.classList.add('liked');
                }
            });
        }

        // 簡單防 XSS
        function escHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ============================================================
        // 點讚功能（防抖 + 樂觀更新）
        // ============================================================
        function toggleLike(id) {
            const now = Date.now();
            if (likeThrottle[id] && now - likeThrottle[id] < 600) return;
            likeThrottle[id] = now;

            const btn = document.getElementById(`like-btn-${id}`);
            const countSpan = document.getElementById(`like-count-${id}`);
            if (!btn || !countSpan) return;

            let currentCount = parseInt(countSpan.innerText) || 0;
            const wasLiked = localLikes[id] || false;

            if (wasLiked) {
                btn.classList.remove('liked');
                currentCount = Math.max(0, currentCount - 1);
                localLikes[id] = false;
            } else {
                btn.classList.add('liked');
                currentCount += 1;
                localLikes[id] = true;
            }
            countSpan.innerText = currentCount;

            // 非同步更新 DB（失敗時回滾）
            fetch(`${SUPABASE_URL}/rest/v1/moments?id=eq.${id}`, {
                method: 'PATCH',
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${currentAccessToken}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ likes_count: currentCount })
            }).catch(() => {
                // 回滾
                localLikes[id] = wasLiked;
                const revertCount = wasLiked ? currentCount + 1 : Math.max(0, currentCount - 1);
                countSpan.innerText = revertCount;
                if (wasLiked) btn.classList.add('liked');
                else btn.classList.remove('liked');
                showToast('點讚失敗，請稍後再試', 'error');
            });
        }

        // ============================================================
        // 發佈精靈 (Wizard)
        // ============================================================
        function openWizard() {
            // 重置表單
            document.getElementById('nickname-input').value = '';
            document.getElementById('custom-mood-input').classList.add('view-hidden');
            document.getElementById('custom-mood-input').value = '';
            document.getElementById('temp-custom-toggle').classList.remove('view-hidden');
            document.getElementById('custom-temp-input').classList.add('view-hidden');
            document.getElementById('custom-temp-input').value = '';
            document.getElementById('custom-weather-input').classList.add('view-hidden');
            document.getElementById('custom-weather-input').value = '';
            document.getElementById('location-input').classList.add('view-hidden');
            document.getElementById('location-input').value = 'Outside';
            document.getElementById('story-main-title').value = '';
            document.getElementById('story-blocks').innerHTML =
                `<textarea class="form-input block-body" style="min-height:110px; resize:vertical; font-size:16px; line-height:1.8;" placeholder="分享你的想法…"></textarea>`;

            // 重置選中狀態
            document.querySelectorAll('.mood-btn, .weather-btn, .loc-btn').forEach(b => b.classList.remove('selected'));
            document.querySelector('.mood-btn[data-val="happy"]')?.classList.add('selected');
            document.querySelector('.weather-btn[data-val="Sunny"]')?.classList.add('selected');
            document.querySelector('.loc-btn.selected')?.classList.remove('selected');
            document.querySelector('.loc-btn[onclick*="Outside"]')?.classList.add('selected');

            entryData.mood = 'happy';
            entryData.weather = 'Sunny';
            entryData.location = 'Outside';
            document.getElementById('temp-slider').value = '22';
            updateTemp();

            document.getElementById('wizard-modal').classList.add('open');
            nextStep(1);
        }

        function closeModal(modalId) {
            document.getElementById(modalId || 'wizard-modal').classList.remove('open');
        }

        // 點擊背景關閉
        document.getElementById('wizard-modal')?.addEventListener('click', function(e) {
            if (e.target === this) closeModal('wizard-modal');
        });

        function nextStep(stepNum) {
            document.querySelectorAll('.wizard-step').forEach(el => el.classList.remove('active'));
            const target = document.getElementById(`step-${stepNum}`);
            if (target) {
                target.classList.add('active');
                // 滾動到頂部
                const sheet = document.querySelector('.modal-sheet');
                if (sheet) sheet.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function selectOption(category, val, btnEl) {
            document.querySelectorAll(`.${category}-btn`).forEach(b => b.classList.remove('selected'));
            btnEl.classList.add('selected');
            entryData[category] = val;
            const customInput = document.getElementById(`custom-${category}-input`);
            if (val === 'custom') {
                customInput.classList.remove('view-hidden');
                setTimeout(() => customInput.focus(), 100);
                scrollToBottom();
            } else {
                customInput.classList.add('view-hidden');
            }
        }

        function selectLocation(val, btnEl) {
            document.querySelectorAll('.loc-btn').forEach(b => b.classList.remove('selected'));
            btnEl.classList.add('selected');
            const locInput = document.getElementById('location-input');
            if (val === 'Custom') {
                locInput.classList.remove('view-hidden');
                locInput.value = '';
                setTimeout(() => locInput.focus(), 100);
                scrollToBottom();
            } else {
                locInput.classList.add('view-hidden');
                locInput.value = val;
            }
            entryData.location = val;
        }

        function updateTemp() {
            const val = parseInt(document.getElementById('temp-slider').value) || 22;
            document.getElementById('temp-val').innerText = val;
            entryData.temp = String(val);
            const thermIcon = document.getElementById('dynamic-thermometer');
            let desc = '';
            if (val < -5) { desc = "嚴寒";
                thermIcon.style.color = "#007AFF"; } else if (val < 5) { desc = "寒冷";
                thermIcon.style.color = "#007AFF"; } else if (val < 15) { desc = "涼爽";
                thermIcon.style.color = "#5AC8FA"; } else if (val < 26) { desc = "舒適";
                thermIcon.style.color = "var(--text-muted)"; } else if (val < 34) { desc = "炎熱";
                thermIcon.style.color = "#FF9500"; } else { desc = "酷熱";
                thermIcon.style.color = "#FF3B30"; }
            document.getElementById('temp-text-status').innerText = desc;
            entryData.tempDesc = desc;
        }

        function toggleCustomTemp() {
            document.getElementById('temp-custom-toggle').classList.add('view-hidden');
            const input = document.getElementById('custom-temp-input');
            input.classList.remove('view-hidden');
            setTimeout(() => input.focus(), 100);
            scrollToBottom();
        }

        // ============================================================
        // 故事編輯器 - 新增區塊
        // ============================================================
        function addStoryBlock(type) {
            const container = document.getElementById('story-blocks');
            if (type === 'subtitle') {
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'form-input block-subtitle';
                input.style.fontSize = '17px';
                input.style.fontWeight = '600';
                input.style.padding = '14px 18px';
                input.placeholder = '小標題…';
                input.maxLength = '60';
                container.appendChild(input);
                setTimeout(() => input.focus(), 100);
            } else if (type === 'body') {
                const textarea = document.createElement('textarea');
                textarea.className = 'form-input block-body';
                textarea.style.minHeight = '100px';
                textarea.style.resize = 'vertical';
                textarea.style.fontSize = '16px';
                textarea.style.lineHeight = '1.8';
                textarea.placeholder = '正文…';
                container.appendChild(textarea);
                setTimeout(() => textarea.focus(), 100);
            }
            scrollToBottom();
        }

        // ============================================================
        // 提交發佈
        // ============================================================
        async function finishWizard() {
            const btn = document.getElementById('btn-save-story');
            btn.disabled = true;
            btn.textContent = '發佈中…';

            try {
                const nickname = document.getElementById('nickname-input').value.trim() || "Anonymous";
                const mood = entryData.mood === 'custom' ?
                    (document.getElementById('custom-mood-input').value.trim() || '自訂') :
                    entryData.mood;
                const customTemp = document.getElementById('custom-temp-input').value.trim();
                const tempDisplay = customTemp || entryData.tempDesc;
                const weather = entryData.weather === 'custom' ?
                    (document.getElementById('custom-weather-input').value.trim() || '自訂') :
                    entryData.weather;
                const location = document.getElementById('location-input').value.trim() || entryData.location || '未知';

                const mainTitle = document.getElementById('story-main-title').value.trim();
                const blockEls = document.getElementById('story-blocks').children;
                const blocks = [];
                for (const el of blockEls) {
                    const text = el.value.trim();
                    if (!text) continue;
                    if (el.classList.contains('block-subtitle')) blocks.push({ type: 'subtitle', text });
                    else if (el.classList.contains('block-body')) blocks.push({ type: 'body', text });
                }
                if (!mainTitle && blocks.length === 0) {
                    showToast('請至少寫點內容 💬', 'error');
                    btn.disabled = false;
                    btn.textContent = '發佈';
                    return;
                }

                const finalStory = JSON.stringify({ nickname, title: mainTitle, blocks });
                const dbDateStr = new Date().toISOString();

                const res = await fetch(`${SUPABASE_URL}/rest/v1/moments`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${currentAccessToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        user_id: studentUserId,
                        date: dbDateStr,
                        content: finalStory,
                        mood: mood,
                        weather: weather,
                        temperature: entryData.temp,
                        location: location,
                        ip_address: currentClientIP,
                        likes_count: 0
                    })
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.message || '發佈失敗');
                }

                showToast('發佈成功！', 'success');
                closeModal('wizard-modal');
                await fetchMoments();
            } catch (err) {
                showToast(' ' + (err.message || '發佈失敗，請稍後再試'), 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '發佈';
            }
        }

        // ============================================================
        // 鍵盤彈起時滾動到輸入框（自動）
        // ============================================================
        document.addEventListener('focusin', function(e) {
            const tag = e.target.tagName.toLowerCase();
            if ((tag === 'input' || tag === 'textarea') && e.target.closest('.modal-sheet')) {
                // 延遲等待鍵盤彈起
                setTimeout(() => {
                    const sheet = document.querySelector('.modal-sheet');
                    if (sheet) {
                        const rect = e.target.getBoundingClientRect();
                        const sheetRect = sheet.getBoundingClientRect();
                        // 如果輸入框被鍵盤遮擋，滾動到可見位置
                        if (rect.bottom > sheetRect.bottom - 80) {
                            sheet.scrollTo({
                                top: e.target.offsetTop - 120,
                                behavior: 'smooth'
                            });
                        }
                    }
                }, 200);
            }
        });

        // ============================================================
        // 輕觸震動（全局）
        // ============================================================
        document.addEventListener('click', function(e) {
            if (e.target.closest('button, .option-btn, .tab-item, .like-btn, .modal-close-btn')) {
                triggerHaptic(10);
            }
        });

        // ============================================================
        // 初始化溫度
        // ============================================================
        updateTemp();

        console.log('Moment 頁面已優化 · 底部導航欄不再遮擋內容');
    </script>
</body>
</html>
