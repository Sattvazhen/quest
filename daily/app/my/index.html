<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>提示 · Aloka</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-paper: #ffffff;
            --bg-sub: #f5f5f7;
            --text-dark: #1d1d1f; 
            --text-muted: #86868b; 
            --apple-blue: #007AFF;
            --apple-blue-light: #E5F1FF;
            --font-en: 'Inter', -apple-system, sans-serif;
            --font-tc: 'Noto Sans TC', 'PingFang TC', sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: var(--font-en), var(--font-tc);
            background-color: var(--bg-paper);
            color: var(--text-dark);
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 32px;
            margin: 0;
        }

        .container {
            max-width: 480px;
            width: 100%;
        }

        .emoji-icon {
            font-size: 64px;
            margin-bottom: 24px;
            display: block;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
        }

        .sub {
            font-size: 16px;
            line-height: 1.6;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .sub-en {
            font-size: 14px;
            color: var(--text-muted);
            opacity: 0.7;
            margin-bottom: 32px;
        }

        .btn-settings {
            display: inline-block;
            background: var(--apple-blue);
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            padding: 16px 40px;
            border-radius: 16px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
        }

        .btn-settings:active {
            transform: scale(0.94);
            box-shadow: 0 2px 6px rgba(0, 122, 255, 0.2);
        }

        .btn-settings:hover {
            background: #0066d9;
        }

        .footer-note {
            margin-top: 48px;
            font-size: 12px;
            color: var(--text-muted);
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="emoji-icon">TvT</span>
        <div class="title">親愛的用戶，非常抱歉！</div>
        <div class="sub">網頁還在逐步製作中！！</div>
        <div class="sub">為您造成的不便請您諒解。</div>
        <div class="sub-en">Dear user, we apologize for the inconvenience.<br>This page is still under construction.</div>
        
        <a href="https://alokaquest.top/daily/app/my/settings" class="btn-settings">設置 Settings</a>
        
        <div class="footer-note">© Candlelight Aloka</div>
    </div>
</body>
</html>
