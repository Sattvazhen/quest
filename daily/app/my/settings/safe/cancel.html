<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Delete Account · Aloka</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-paper: #ffffff;
            --bg-sub: #f5f5f7;
            --text-dark: #1d1d1f; 
            --text-muted: #86868b; 
            --error-color: #ff3b30;
            --apple-blue: #007AFF;
            --font-en: 'Inter', -apple-system, sans-serif;
            --font-tc: 'Noto Sans TC', 'PingFang TC', sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: var(--font-en), var(--font-tc); background-color: var(--bg-paper); color: var(--text-dark);
            height: 100vh; overflow: hidden;
        }

        #app-section { display: flex; flex-direction: column; height: 100%; max-width: 600px; margin: 0 auto; }

        .app-header {
            display: flex; align-items: center; padding: calc(env(safe-area-inset-top, 40px) + 12px) 24px 16px; 
            border-bottom: 1px solid rgba(0,0,0,0.06); gap: 16px;
        }
        .back-btn { color: var(--apple-blue); text-decoration: none; display: flex; align-items: center; }
        .app-header h1 { font-size: 20px; font-weight: 600; }

        .main-view { flex: 1; overflow-y: auto; padding: 40px 32px; }

        .warning-block { margin-bottom: 32px; }
        .warning-title { font-size: 18px; font-weight: 700; color: var(--error-color); margin-bottom: 8px; }
        .warning-desc { font-size: 15px; line-height: 1.6; color: var(--text-dark); }
        .warning-desc-sub { font-size: 12px; color: var(--text-muted); display: block; margin-top: 4px; }

        .form-input {
            width: 100%; background: var(--bg-sub); border: 1px solid rgba(0,0,0,0.1); padding: 18px 20px;
            border-radius: 16px; font-size: 16px; outline: none; margin-bottom: 32px;
        }

        .btn-danger {
            width: 100%; padding: 18px; border-radius: 16px; border: none;
            background: var(--error-color); color: #fff; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; gap: 2px;
            transition: transform 0.2s var(--ease-curve);
        }
        .btn-danger:disabled { background: #ffa3a3; cursor: not-allowed; }
        .btn-danger span:first-child { font-weight: 600; font-size: 16px; }
        .btn-danger span:last-child { font-weight: 400; font-size: 12px; opacity: 0.9; }
        .btn-danger:active:not(:disabled) { transform: scale(0.98); }
    </style>
</head>
<body>

    <div id="app-section">
        <header class="app-header">
            <a href="index.html" class="back-btn">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none"><path d="M15 18l-6-6 6-6"/></svg>
            </a>
            <h1>Delete Account</h1>
        </header>

        <div class="main-view">
            <div class="warning-block">
                <div class="warning-title">Irreversible Action</div>
                <div class="warning-desc">
                    This will permanently delete your account and all associated data.
                    <span class="warning-text-sub">此操作不可逆，您的帳戶及所有相關數據將被永久刪除。</span>
                </div>
            </div>

            <label style="font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 12px; display: block;">
                Type "DELETE" to confirm / 請輸入 "DELETE" 以確認
            </label>
            <input type="text" id="confirm-input" class="form-input" placeholder="DELETE">

            <button class="btn-danger" id="btn-cancel" onclick="handleAccountDeletion()" disabled>
                <span>Permanently Delete My Account</span>
                <span>永久刪除帳戶</span>
            </button>
            
            <div id="status-msg" style="margin-top: 24px; color: var(--error-color); font-size: 14px; font-weight: 500;"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://nhjkhtrgehznhdlqyybs.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_BFkX70SHXwbSmNzE_h7AQg_a1OwKkO_";
        let currentAccessToken = localStorage.getItem('aloka_sb_token');

        const inputEl = document.getElementById('confirm-input');
        const btnEl = document.getElementById('btn-cancel');

        inputEl.addEventListener('input', (e) => {
            btnEl.disabled = e.target.value !== "DELETE";
        });

        async function handleAccountDeletion() {
            if (!confirm("Are you ABSOLUTELY sure? / 您確定要這麼做嗎？")) return;

            btnEl.innerHTML = "<span>Processing...</span><span>處理中...</span>";
            btnEl.disabled = true;

            try {
                const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
                    method: 'DELETE',
                    headers: { 
                        'apikey': SUPABASE_ANON_KEY, 
                        'Authorization': `Bearer ${currentAccessToken}`,
                        'Content-Type': 'application/json' 
                    }
                });

                if (res.ok) {
                    localStorage.removeItem('aloka_sb_token');
                    window.location.href = '../../../index.html';
                } else {
                    throw new Error("Deletion failed. / 刪除失敗。");
                }
            } catch (err) {
                document.getElementById('status-msg').innerText = err.message;
                btnEl.innerHTML = "<span>Permanently Delete My Account</span><span>永久刪除帳戶</span>";
                btnEl.disabled = false;
            }
        }
    </script>
</body>
</html>
