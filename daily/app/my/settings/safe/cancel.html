<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Aloka — 删除账户</title>

    <style>
        :root {
            /* ---- Apple 设计令牌（唯一数值来源） ---- */
            --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                "Helvetica Neue", "PingFang TC", "PingFang SC", "Hiragino Sans GB",
                "Microsoft YaHei", "Noto Sans TC", "Noto Sans SC", Arial, sans-serif;

            --ink-1: #1d1d1f; --ink-2: #424245; --ink-3: #6e6e73; --ink-4: #86868b;
            --line: rgba(0, 0, 0, 0.10);

            --surface-1: #ffffff; --surface-2: #fbfbfd; --surface-3: #f5f5f7;
            --surface-invert: #060607; --on-invert-1: #f5f5f7; --on-invert-2: #a1a1a6;
            --line-invert: rgba(255, 255, 255, 0.16);

            --accent: #0071e3; --accent-hover: #0077ed; --accent-press: #0068cf;
            --accent-wash: rgba(0, 113, 227, 0.06); --accent-on-dark: #2997ff;

            --error-color: #ff3b30; --success-color: #34c759;

            --radius-xs: 6px; --radius-sm: 10px; --radius-md: 18px;
            --radius-lg: 28px; --radius-pill: 999px;

            --ease-out: cubic-bezier(0.32, 0.72, 0, 1);
            --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
            --dur-fast: 200ms; --dur-base: 320ms; --dur-reveal: 640ms;
            --size-hit: 44px;

            --safe-top: env(safe-area-inset-top, 20px);
            --safe-bottom: env(safe-area-inset-bottom, 20px);

            /* ---- 旧变量别名（保留，禁止删除） ---- */
            --bg-paper: var(--surface-1);
            --bg-sub: var(--surface-3);
            --text-dark: var(--ink-1);
            --text-primary: var(--ink-1);
            --text-secondary: var(--ink-2);
            --text-muted: var(--ink-3);
            --line-light: var(--line);
            --apple-blue: var(--accent);
            --apple-blue-hover: var(--accent-hover);
            --apple-blue-light: var(--accent-wash);
            --radius: var(--radius-md);
            --ease-curve: var(--ease-out);
            --font-en: var(--font-sans);
            --font-tc: var(--font-sans);
            --glass-bg: rgba(255, 255, 255, 0.78);
        }

        [data-theme="dark"] {
            --bg-paper: #000000; --bg-sub: #1c1c1e;
            --text-dark: #f5f5f7; --text-muted: #8e8e93;
            --line-light: rgba(255, 255, 255, 0.12);
            --apple-blue-light: rgba(41, 151, 255, 0.14);
            --glass-bg: rgba(28, 28, 30, 0.78);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            font-family: var(--font-sans);
            background: var(--surface-1);
            color: var(--ink-1);
            -webkit-font-smoothing: antialiased;
            text-align: left;
            letter-spacing: 0.01em;
            overflow-x: clip;
            height: 100dvh;
            overflow: hidden;
        }

        :lang(zh), :lang(zh-TW), :lang(zh-Hant), :lang(zh-CN) { letter-spacing: 0.01em; }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
            border-radius: 2px;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        .skip-link { position: absolute; left: -9999px; top: 0; z-index: 30; padding: 12px 16px; background: var(--surface-1); color: var(--ink-1); border: 1px solid var(--line); border-radius: var(--radius-sm); }
        .skip-link:focus { left: 16px; top: 16px; }

        #app-section { display: flex; flex-direction: column; height: 100%; max-width: 600px; margin: 0 auto; }

        .app-header {
            display: flex; align-items: center; padding: calc(var(--safe-top) + 12px) 24px 16px;
            background: var(--surface-1); border-bottom: 1px solid var(--line); gap: 16px;
        }
        .back-btn { color: var(--accent); text-decoration: none; display: flex; align-items: center; min-height: var(--size-hit); }
        .app-header h1 { font-size: 20px; font-weight: 600; color: var(--ink-1); }

        .main-view { flex: 1; overflow-y: auto; padding: 40px 24px calc(var(--safe-bottom) + 24px); }

        .warning-block { margin-bottom: 32px; }
        .warning-title { font-size: 18px; font-weight: 600; color: var(--error-color); margin-bottom: 8px; }
        .warning-desc { font-size: 15px; line-height: 1.6; color: var(--ink-1); }
        .warning-text-sub { font-size: 13px; color: var(--ink-2); display: block; margin-top: 4px; }

        .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 8px; }

        .form-input {
            width: 100%; background: var(--surface-3); border: 1px solid var(--line); padding: 14px 16px;
            border-radius: var(--radius-sm); font-size: 16px; color: var(--ink-1); margin-bottom: 24px;
            transition: border-color var(--dur-fast) var(--ease-out);
        }
        .form-input:focus { border-color: var(--accent); }

        .btn {
            width: 100%; padding: 14px; min-height: var(--size-hit); border-radius: var(--radius-pill); border: none;
            cursor: pointer;
            display: flex; flex-direction: column; align-items: center; gap: 2px;
            transition: opacity var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out);
        }
        .btn.btn-danger { background: var(--error-color); color: #fff; }
        .btn.btn-danger:disabled { background: rgba(255, 59, 48, 0.35); cursor: not-allowed; }
        .btn.btn-danger span:first-child { font-weight: 600; font-size: 16px; }
        .btn.btn-danger span:last-child { font-weight: 400; font-size: 12px; opacity: 0.9; }
        .btn.btn-danger:active:not(:disabled) { opacity: 0.88; }
    </style>
</head>
<body>

    <a class="skip-link" href="#main">跳到主要内容</a>

    <div id="app-section">
        <header class="app-header">
            <a href="index.html" class="back-btn" aria-label="Back / 返回">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
            </a>
            <h1>Delete Account</h1>
        </header>

        <main id="main" class="main-view">
            <div class="warning-block">
                <h2 class="warning-title">Irreversible Action</h2>
                <p class="warning-desc">
                    This will permanently delete your account and all associated data.
                    <span class="warning-text-sub">此操作不可逆，您的帳戶及所有相關數據將被永久刪除。</span>
                </p>
            </div>

            <label for="confirm-input" class="form-label">
                Type "DELETE" to confirm / 請輸入 "DELETE" 以確認
            </label>
            <input type="text" id="confirm-input" class="form-input" placeholder="DELETE">

            <button class="btn btn-danger" id="btn-cancel" onclick="handleAccountDeletion()" disabled>
                <span>Permanently Delete My Account</span>
                <span>永久刪除帳戶</span>
            </button>

            <div id="status-msg" style="margin-top: 24px; color: var(--error-color); font-size: 14px; font-weight: 500;"></div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = "https://nhjkhtrgehznhdlqyybs.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_BFkX70SHXwbSmNzE_h7AQg_a1OwKkO_";
        let currentAccessToken = localStorage.getItem('aloka_sb_token');

        const inputEl = document.getElementById('confirm-input');
        const btnEl = document.getElementById('btn-cancel');

        inputEl.addEventListener('input', (e) => {
            btnEl.disabled = e.target.value !== "DELETE";
        });

        async function handleAccountDeletion() {
            if (!confirm("Are you ABSOLUTELY sure? / 您確定要這麼做嗎？")) return;

            btnEl.innerHTML = "<span>Processing...</span><span>處理中...</span>";
            btnEl.disabled = true;

            try {
                const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
                    method: 'DELETE',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${currentAccessToken}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (res.ok) {
                    localStorage.removeItem('aloka_sb_token');
                    window.location.href = '../../../index.html';
                } else {
                    throw new Error("Deletion failed. / 刪除失敗。");
                }
            } catch (err) {
                document.getElementById('status-msg').innerText = err.message;
                btnEl.innerHTML = "<span>Permanently Delete My Account</span><span>永久刪除帳戶</span>";
                btnEl.disabled = false;
            }
        }
    </script>
</body>
</html>
