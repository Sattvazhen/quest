<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Change Email · Daily Story</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-paper: #ffffff;
            --bg-sub: #f5f5f7;
            --text-dark: #1d1d1f; 
            --text-muted: #86868b; 
            --apple-blue: #007AFF;
            --error-color: #ff3b30;
            --success-color: #34c759;
            --ease-curve: cubic-bezier(0.32, 0.72, 0, 1); 
            --font-en: 'Inter', -apple-system, sans-serif;
            --font-tc: 'Noto Sans TC', 'PingFang TC', sans-serif;
        }
        [data-theme="dark"] {
            --bg-paper: #000000; --bg-sub: #1c1c1e; --text-dark: #f5f5f7; --text-muted: #8e8e93;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: var(--font-en); background-color: var(--bg-paper); color: var(--text-dark);
            -webkit-font-smoothing: antialiased; text-align: left; height: 100vh; overflow: hidden;
            letter-spacing: 0.01em; transition: background-color 0.4s var(--ease-curve), color 0.4s var(--ease-curve);
        }
        .auth-container {
            width: 100%; min-height: 100dvh; display: flex; align-items: center; justify-content: flex-start;
            padding: 40px 32px; background: var(--bg-paper);
        }
        .auth-wrapper { width: 100%; max-width: 380px; position: relative; text-align: left; margin: 0 auto; }
        
        .brand-title { font-size: 34px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 8px; }
        .brand-subtitle { font-family: var(--font-tc); font-size: 15px; color: var(--text-muted); margin-bottom: 3.5rem; line-height: 1.5; }
        
        .form-input {
            width: 100%; background: var(--bg-sub); border: 1px solid transparent; padding: 18px 20px;
            border-radius: 16px; font-size: 16px; outline: none; color: var(--text-dark);
            margin-bottom: 20px; transition: all 0.4s var(--ease-curve);
        }
        .form-input:focus { border-color: var(--apple-blue); background: var(--bg-paper); }
        .form-input:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .btn-primary {
            width: 100%; font-size: 16px; font-weight: 600; padding: 18px; border-radius: 16px;
            cursor: pointer; transition: all 0.4s var(--ease-curve); display: inline-flex;
            justify-content: center; align-items: center; gap: 8px; margin-bottom: 12px;
            color: #ffffff; background: var(--apple-blue); border: none; text-decoration: none;
        }
        .btn-primary:active { transform: scale(0.95); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

        .auth-switch { font-size: 15px; font-weight: 500; color: var(--apple-blue); cursor: pointer; margin-top: 1.5rem; display: inline-block; text-decoration: none; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-wrapper" id="form-section">
            <div class="brand-title">Daily Story</div>
            <div class="brand-subtitle">Change Email / 更改信箱</div>
            
            <input type="email" class="form-input" id="new-email" placeholder="New Email Address / 新信箱地址">
            <input type="email" class="form-input" id="confirm-email" placeholder="Confirm New Email / 再次輸入新信箱">
            
            <button class="btn-primary" id="btn-update" onclick="handleEmailChange()">Update Email / 確認更改</button>
            
            <a href="./index.html" class="auth-switch">Back / 返回</a>

            <div id="status-msg" style="font-size:14px; margin-top:16px; line-height: 1.5;"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://nhjkhtrgehznhdlqyybs.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_BFkX70SHXwbSmNzE_h7AQg_a1OwKkO_";
        let currentAccessToken = localStorage.getItem('aloka_sb_token');

        window.onload = () => {
            const msgEl = document.getElementById('status-msg');
            const inputEl = document.getElementById('new-email');
            const confirmEl = document.getElementById('confirm-email');
            const btnEl = document.getElementById('btn-update');

            if (!currentAccessToken) {
                inputEl.disabled = true;
                confirmEl.disabled = true;
                btnEl.disabled = true;
                msgEl.style.color = 'var(--error-color)';
                msgEl.innerHTML = 'Authentication required. Please log in first.<br>您尚未登入，請先返回首頁登入。';
            }
        };

        async function handleEmailChange() {
            const newEmail = document.getElementById('new-email').value.trim();
            const confirmEmail = document.getElementById('confirm-email').value.trim();
            const msgEl = document.getElementById('status-msg');
            const btn = document.getElementById('btn-update');

            if (!newEmail || !confirmEmail) {
                msgEl.style.color = 'var(--error-color)';
                msgEl.innerText = 'Please fill in both fields. / 請填寫完整欄位。';
                return;
            }

            if (newEmail !== confirmEmail) {
                msgEl.style.color = 'var(--error-color)';
                msgEl.innerText = 'Emails do not match. / 兩次輸入的信箱地址不一致。';
                return;
            }

            btn.disabled = true;
            btn.innerText = 'Updating... / 處理中...';
            msgEl.innerText = '';

            try {
                const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
                    method: 'PUT',
                    headers: { 
                        'apikey': SUPABASE_ANON_KEY, 
                        'Authorization': `Bearer ${currentAccessToken}`,
                        'Content-Type': 'application/json' 
                    },
                    body: JSON.stringify({ email: newEmail })
                });

                const data = await res.json();
                
                if (!res.ok) throw new Error(data.msg || data.error_description || 'Update failed');

                msgEl.style.color = 'var(--success-color)';
                msgEl.innerHTML = 'Confirmation links sent! <br>For security, please check <b>BOTH</b> your old and new email inboxes to confirm the change.<br><br>確認信已發送！為確保安全，請前往您的<b>新信箱與舊信箱</b>點擊確認連結以完成更改。';
                
                document.getElementById('new-email').value = '';
                document.getElementById('confirm-email').value = '';

            } catch (err) {
                msgEl.style.color = 'var(--error-color)';
                msgEl.innerText = err.message || '發生錯誤，請稍後再試。';
                btn.disabled = false;
            } finally {
                if(!msgEl.innerHTML.includes('success')) {
                    btn.innerText = 'Update Email / 確認更改';
                }
            }
        }
    </script>
</body>
</html>
