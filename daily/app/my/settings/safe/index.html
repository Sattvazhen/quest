<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Aloka — 账户与安全</title>

    <style>
        :root {
            /* ---- Apple 设计令牌（唯一数值来源） ---- */
            --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                "Helvetica Neue", "PingFang TC", "PingFang SC", "Hiragino Sans GB",
                "Microsoft YaHei", "Noto Sans TC", "Noto Sans SC", Arial, sans-serif;

            --ink-1: #1d1d1f; --ink-2: #424245; --ink-3: #6e6e73; --ink-4: #86868b;
            --line: rgba(0, 0, 0, 0.10);

            --surface-1: #ffffff; --surface-2: #fbfbfd; --surface-3: #f5f5f7;
            --surface-invert: #060607; --on-invert-1: #f5f5f7; --on-invert-2: #a1a1a6;
            --line-invert: rgba(255, 255, 255, 0.16);

            --accent: #0071e3; --accent-hover: #0077ed; --accent-press: #0068cf;
            --accent-wash: rgba(0, 113, 227, 0.06); --accent-on-dark: #2997ff;

            --error-color: #ff3b30; --success-color: #34c759;

            --radius-xs: 6px; --radius-sm: 10px; --radius-md: 18px;
            --radius-lg: 28px; --radius-pill: 999px;

            --ease-out: cubic-bezier(0.32, 0.72, 0, 1);
            --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
            --dur-fast: 200ms; --dur-base: 320ms; --dur-reveal: 640ms;
            --size-hit: 44px;

            --safe-top: env(safe-area-inset-top, 20px);
            --safe-bottom: env(safe-area-inset-bottom, 20px);

            /* ---- 旧变量别名（保留，禁止删除） ---- */
            --bg-paper: var(--surface-1);
            --bg-sub: var(--surface-3);
            --text-dark: var(--ink-1);
            --text-primary: var(--ink-1);
            --text-secondary: var(--ink-2);
            --text-muted: var(--ink-3);
            --line-light: var(--line);
            --apple-blue: var(--accent);
            --apple-blue-hover: var(--accent-hover);
            --apple-blue-light: var(--accent-wash);
            --radius: var(--radius-md);
            --ease-curve: var(--ease-out);
            --font-en: var(--font-sans);
            --font-tc: var(--font-sans);
            --glass-bg: rgba(255, 255, 255, 0.78);
        }

        [data-theme="dark"] {
            --bg-paper: #000000; --bg-sub: #1c1c1e;
            --text-dark: #f5f5f7; --text-muted: #8e8e93;
            --line-light: rgba(255, 255, 255, 0.12);
            --apple-blue-light: rgba(41, 151, 255, 0.14);
            --glass-bg: rgba(28, 28, 30, 0.78);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            font-family: var(--font-sans);
            background: var(--surface-1);
            color: var(--ink-1);
            -webkit-font-smoothing: antialiased;
            text-align: left;
            letter-spacing: 0.01em;
            overflow-x: clip;
            height: 100dvh;
            overflow: hidden;
        }

        :lang(zh), :lang(zh-TW), :lang(zh-Hant), :lang(zh-CN) { letter-spacing: 0.01em; }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
            border-radius: 2px;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        .skip-link { position: absolute; left: -9999px; top: 0; z-index: 30; padding: 12px 16px; background: var(--surface-invert); color: var(--on-invert-1); }
        .skip-link:focus { left: 16px; top: 16px; }

        #app-section { display: flex; flex-direction: column; height: 100%; max-width: 600px; margin: 0 auto; background: var(--surface-3); }

        .app-header {
            display: flex; align-items: center; padding: calc(var(--safe-top) + 12px) 24px 16px;
            background: var(--surface-1); border-bottom: 1px solid var(--line); gap: 16px;
        }
        .back-btn { color: var(--accent); text-decoration: none; display: flex; align-items: center; min-height: var(--size-hit); }
        .app-header h1 { font-size: 20px; font-weight: 600; color: var(--ink-1); }

        .main-view { flex: 1; overflow-y: auto; padding: 24px 16px calc(var(--safe-bottom) + 24px); }

        .settings-group {
            background: var(--surface-1); border-radius: var(--radius-md);
            overflow: hidden; border: 1px solid var(--line);
        }

        .settings-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 20px; text-decoration: none; color: var(--ink-1);
            border-bottom: 1px solid var(--line);
            transition: background-color var(--dur-fast) var(--ease-out);
        }
        .settings-item:last-child { border-bottom: none; }
        .settings-item:active { background: var(--surface-3); }

        .settings-text-wrapper { display: flex; flex-direction: column; gap: 2px; }
        .settings-label { font-size: 16px; font-weight: 500; color: var(--ink-1); }
        .settings-label-sub { font-size: 13px; color: var(--ink-2); }

        .chevron-icon { color: var(--ink-3); flex: none; }
    </style>
</head>
<body>

    <a class="skip-link" href="#main">跳到主要内容</a>

    <svg width="0" height="0" style="display:none;" aria-hidden="true">
        <defs>
            <g id="icon-back"><path d="M15 18l-6-6 6-6" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
            <g id="icon-chevron"><path d="M9 18l6-6-6-6" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
        </defs>
    </svg>

    <div id="app-section">
        <header class="app-header">
            <a href="../index.html" class="back-btn" aria-label="Back / 返回">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
            </a>
            <h1>Security</h1>
        </header>

        <main id="main" class="main-view">
            <div class="settings-group">
                <a href="change-email-address.html" class="settings-item">
                    <div class="settings-text-wrapper">
                        <span class="settings-label">Change Email Address</span>
                        <span class="settings-label-sub">更改電子郵件地址</span>
                    </div>
                    <svg class="chevron-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
                </a>

                <a href="cancel.html" class="settings-item">
                    <div class="settings-text-wrapper">
                        <span class="settings-label" style="color: var(--error-color);">Delete Account</span>
                        <span class="settings-label-sub">刪除帳戶 (註銷帳號)</span>
                    </div>
                    <svg class="chevron-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
                </a>
            </div>
        </main>
    </div>

</body>
</html>
