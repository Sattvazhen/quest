<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Account & Security · Candlelight Aloka</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-paper: #ffffff;
            --bg-sub: #f5f5f7;
            --text-dark: #1d1d1f; 
            --text-muted: #86868b; 
            --line-light: rgba(0, 0, 0, 0.06);
            --apple-blue: #007AFF;
            --safe-top: env(safe-area-inset-top, 40px); 
            --font-en: 'Inter', -apple-system, sans-serif;
            --font-tc: 'Noto Sans TC', 'PingFang TC', sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: var(--font-en), var(--font-tc); background-color: var(--bg-sub); color: var(--text-dark);
            height: 100vh; overflow: hidden;
        }

        #app-section { display: flex; flex-direction: column; height: 100%; max-width: 600px; margin: 0 auto; background: var(--bg-sub); }

        .app-header {
            display: flex; align-items: center; padding: calc(var(--safe-top) + 12px) 24px 16px; 
            background: var(--bg-paper); border-bottom: 1px solid var(--line-light); gap: 16px;
        }
        .back-btn { color: var(--apple-blue); text-decoration: none; display: flex; align-items: center; }
        .app-header h1 { font-size: 20px; font-weight: 600; }

        .main-view { flex: 1; overflow-y: auto; padding: 32px; }

        .settings-group {
            background: var(--bg-paper); border-radius: 20px;
            overflow: hidden; border: 1px solid var(--line-light);
        }

        .settings-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 24px; text-decoration: none; color: var(--text-dark);
            border-bottom: 1px solid var(--line-light); cursor: pointer;
        }
        .settings-item:last-child { border-bottom: none; }

        .settings-text-wrapper { display: flex; flex-direction: column; gap: 2px; }
        .settings-label { font-size: 16px; font-weight: 500; }
        .settings-label-sub { font-size: 12px; color: var(--text-muted); }

        .chevron-icon { color: var(--text-muted); opacity: 0.5; }
    </style>
</head>
<body>

    <svg width="0" height="0" style="display:none;">
        <defs>
            <g id="icon-back"><path d="M15 18l-6-6 6-6" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
            <g id="icon-chevron"><path d="M9 18l6-6-6-6" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
        </defs>
    </svg>

    <div id="app-section">
        <header class="app-header">
            <a href="../index.html" class="back-btn">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none"><path d="M15 18l-6-6 6-6"/></svg>
            </a>
            <h1>Security</h1>
        </header>

        <div class="main-view">
            <div class="settings-group">
                <a href="change-email-address.html" class="settings-item">
                    <div class="settings-text-wrapper">
                        <span class="settings-label">Change Email Address</span>
                        <span class="settings-label-sub">更改電子郵件地址</span>
                    </div>
                    <svg class="chevron-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none"><path d="M9 18l6-6-6-6"/></svg>
                </a>
                
                <a href="cancel.html" class="settings-item">
                    <div class="settings-text-wrapper">
                        <span class="settings-label" style="color: #ff3b30;">Delete Account</span>
                        <span class="settings-label-sub">刪除帳戶 (註銷帳號)</span>
                    </div>
                    <svg class="chevron-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none"><path d="M9 18l6-6-6-6"/></svg>
                </a>
            </div>
        </div>
    </div>

</body>
</html>
