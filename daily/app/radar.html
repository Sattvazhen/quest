<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Aloka — 雷达匹配</title>

    <style>
        :root {
            /* ---- Apple 设计令牌（唯一数值来源） ---- */
            --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                "Helvetica Neue", "PingFang TC", "PingFang SC", "Hiragino Sans GB",
                "Microsoft YaHei", "Noto Sans TC", "Noto Sans SC", Arial, sans-serif;

            --ink-1: #1d1d1f; --ink-2: #424245; --ink-3: #6e6e73; --ink-4: #86868b;
            --line: rgba(0, 0, 0, 0.10);

            --surface-1: #ffffff; --surface-2: #fbfbfd; --surface-3: #f5f5f7;
            --surface-invert: #060607; --on-invert-1: #f5f5f7; --on-invert-2: #a1a1a6;
            --line-invert: rgba(255, 255, 255, 0.16);

            --accent: #0071e3; --accent-hover: #0077ed; --accent-press: #0068cf;
            --accent-wash: rgba(0, 113, 227, 0.06); --accent-on-dark: #2997ff;

            --error-color: #ff3b30; --success-color: #34c759;

            --radius-xs: 6px; --radius-sm: 10px; --radius-md: 18px;
            --radius-lg: 28px; --radius-pill: 999px;

            --ease-out: cubic-bezier(0.32, 0.72, 0, 1);
            --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
            --dur-fast: 200ms; --dur-base: 320ms; --dur-reveal: 640ms;
            --size-hit: 44px;

            --safe-top: env(safe-area-inset-top, 20px);
            --safe-bottom: env(safe-area-inset-bottom, 20px);

            /* ---- 旧变量别名（保留，禁止删除） ---- */
            --bg-paper: var(--surface-1);
            --bg-sub: var(--surface-3);
            --text-dark: var(--ink-1);
            --text-primary: var(--ink-1);
            --text-secondary: var(--ink-2);
            --text-muted: var(--ink-3);
            --line-light: var(--line);
            --apple-blue: var(--accent);
            --apple-blue-hover: var(--accent-hover);
            --apple-blue-light: var(--accent-wash);
            --radius: var(--radius-md);
            --ease-curve: var(--ease-out);
            --font-en: var(--font-sans);
            --font-tc: var(--font-sans);
            --glass-bg: rgba(255, 255, 255, 0.78);
        }

        [data-theme="dark"] {
            --bg-paper: #000000; --bg-sub: #1c1c1e;
            --text-dark: #f5f5f7; --text-muted: #8e8e93;
            --line-light: rgba(255, 255, 255, 0.12);
            --apple-blue-light: rgba(41, 151, 255, 0.14);
            --glass-bg: rgba(28, 28, 30, 0.78);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            font-family: var(--font-sans); background-color: var(--bg-sub); color: var(--text-dark);
            -webkit-font-smoothing: antialiased; text-align: left; height: 100dvh; overflow: hidden;
            letter-spacing: 0.01em; transition: background-color 0.4s var(--ease-curve), color 0.4s var(--ease-curve);

            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        :lang(zh), :lang(zh-TW), :lang(zh-Hant), :lang(zh-CN) { letter-spacing: 0.01em; }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .skip-link { position: absolute; left: -9999px; top: 0; z-index: 30; padding: 12px 16px; background: var(--bg-paper); color: var(--text-dark); border: 1px solid var(--line-light); border-radius: var(--radius-sm); }
        .skip-link:focus { left: 16px; top: 16px; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        .view-hidden { display: none; }
        #radar-scan-view.view-hidden, #match-container.view-hidden { display: none; }

        #app-section {
            display: flex; flex-direction: column; height: 100%; max-width: 100%;
            margin: 0 auto; background: var(--bg-sub); position: relative; overflow: hidden;
            animation: appStageIn var(--dur-reveal) var(--ease-curve);
        }
        @media (min-width: 600px) { #app-section { max-width: 600px; border-left: 1px solid var(--line-light); border-right: 1px solid var(--line-light); } }

        @keyframes appStageIn { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .app-header {
            display: flex; align-items: flex-end; justify-content: space-between;
            padding: calc(var(--safe-top) + 32px) 32px 24px; background: var(--bg-sub); flex-shrink: 0;
            border-bottom: 1px solid var(--line-light);
        }
        .app-header-left { text-align: left; }
        .app-header h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.8px; line-height: 1.1; margin-bottom: 6px; }
        .status-text { font-size: 14px; color: var(--text-muted); font-weight: 500; display: flex; align-items: center; gap: 8px; }
        
        .pulse-dot { width: 8px; height: 8px; background-color: var(--success-color); border-radius: 50%; position: relative; transition: background-color 0.3s; }
        .pulse-dot::after {
            content: ''; position: absolute; inset: -4px; border-radius: 50%;
            border: 2px solid var(--success-color); opacity: 0.3;
            transition: border-color 0.3s;
        }
        .pulse-dot.idle { background-color: transparent; border: 1.5px solid var(--text-muted); }
        .pulse-dot.idle::after { border-color: var(--text-muted); opacity: 0.3; }

        .main-view { 
            flex: 1; overflow-y: auto; padding: 32px; 
            padding-bottom: calc(100px + var(--safe-bottom));
            scroll-behavior: smooth; position: relative;
        }
        .main-view::-webkit-scrollbar { display: none; }

        #radar-scan-view {
            display: flex; flex-direction: column; align-items: flex-start;
            height: 100%; position: absolute; top: 32px; left: 32px; right: 32px;
            animation: fadeIn 0.5s var(--ease-curve);
        }
        
        .radar-compass {
            position: relative; width: 240px; height: 240px;
            border-radius: 50%; border: 1px solid var(--line-light);
            margin-bottom: 32px; flex-shrink: 0;
            background: radial-gradient(circle at center, transparent 60%, var(--line-light) 200%);
            overflow: hidden;
        }

        .radar-compass::before { content: ''; position: absolute; top: 0; left: 50%; width: 1px; height: 100%; background: var(--line-light); transform: translateX(-50%); }
        .radar-compass::after { content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background: var(--line-light); transform: translateY(-50%); }
        
        .radar-ring { position: absolute; top: 50%; left: 50%; border: 1px solid var(--line-light); border-radius: 50%; transform: translate(-50%, -50%); }
        .radar-ring.inner { width: 33%; height: 33%; }
        .radar-ring.middle { width: 66%; height: 66%; }
        
        .radar-sweep {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 78%, rgba(0, 113, 227, 0.05) 92%, rgba(0, 113, 227, 0.15) 100%);
        }

        .radar-blip { position: absolute; width: 6px; height: 6px; background: transparent; border: 1.5px solid var(--apple-blue); border-radius: 50%; opacity: 1; }

        .blip-1 { top: 25%; left: 65%; }
        .blip-2 { top: 70%; left: 35%; }
        .blip-3 { top: 40%; left: 20%; }

        .scan-log-container { text-align: left; z-index: 10; }
        .scan-subtitle { font-size: 15px; color: var(--text-muted); font-weight: 500; line-height: 1.6; }

        #match-container { animation: fadeIn 0.6s var(--ease-curve); }

        .match-card {
            background: var(--bg-paper); border-radius: var(--radius); padding: 28px;
            margin-bottom: 24px; border: 1px solid var(--line-light); text-align: left; position: relative; overflow: hidden;
            display: flex; flex-direction: column; gap: 20px;
        }

        .match-header { display: flex; align-items: center; gap: 16px; }
        .avatar { width: 56px; height: 56px; border-radius: 50%; background-color: var(--bg-sub); object-fit: cover; flex-shrink: 0; border: 1px solid var(--line-light); }
        .user-info { display: flex; flex-direction: column; gap: 4px; }
        .nickname { font-size: 18px; font-weight: 700; color: var(--text-dark); letter-spacing: -0.3px; }
        .location { font-size: 13px; color: var(--text-muted); font-weight: 500; display: flex; align-items: center; gap: 4px; }

        .similarity-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
        .sim-label { font-size: 14px; font-weight: 600; color: var(--text-dark); }
        .sim-score { font-size: 24px; font-weight: 700; color: var(--apple-blue); font-variant-numeric: tabular-nums; letter-spacing: -1px; }
        
        .tags-container { display: flex; flex-wrap: wrap; gap: 8px; }
        .tag-badge { background: var(--bg-sub); color: var(--text-secondary); padding: 6px 12px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; }
        .tag-badge.shared { background: var(--apple-blue-light); color: var(--apple-blue); font-weight: 600; }

        .btn-message {
            width: 100%; font-size: 15px; font-weight: 600; padding: 16px; border-radius: var(--radius-sm);
            cursor: pointer; transition: background-color 0.4s var(--ease-curve); display: flex; justify-content: center; align-items: center; gap: 8px;
            color: var(--text-dark); background: var(--bg-sub); border: none; margin-top: 8px;
        }
        .btn-message:active { background: var(--line-light); }
        .btn-message svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }

        .empty-state {
            display: flex; flex-direction: column; align-items: flex-start; gap: 16px;
            text-align: left; padding: 20px 0;
        }
        .empty-icon-box {
            width: 48px; height: 48px; border-radius: var(--radius-md); background: var(--bg-paper); border: 1px solid var(--line-light);
            display: flex; align-items: center; justify-content: center; color: var(--text-muted); margin-bottom: 8px;
        }
        .empty-icon-box svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .empty-title { font-size: 20px; font-weight: 700; color: var(--text-dark); letter-spacing: -0.5px; margin: 0; }
        .empty-desc { font-size: 15px; color: var(--text-muted); line-height: 1.6; margin: 0; max-width: 90%; }
        
        .btn-secondary {
            background: transparent; border: 1px solid var(--line-light); color: var(--text-dark);
            padding: 12px 20px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600;
            cursor: pointer; transition: background-color 0.3s var(--ease-curve), border-color 0.3s var(--ease-curve); margin-top: 8px;
        }
        .btn-secondary:active { background: var(--line-light); }

        .bottom-tab-bar {
            position: absolute; bottom: 0; left: 0; width: 100%; height: calc(64px + var(--safe-bottom));
            background: var(--glass-bg);
            border-top: 1px solid var(--line-light); display: flex; justify-content: space-around;
            align-items: flex-start; padding-top: 12px; z-index: 100;
        }
        .tab-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: var(--text-muted); gap: 6px; transition: color 0.4s var(--ease-curve); width: 20%; }
        .tab-item.active { color: var(--text-dark); }
        .tab-item:active { color: var(--accent-press); }
        .tab-item svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .tab-item span { font-size: 10px; font-weight: 500; letter-spacing: 0.5px; }
    </style>
</head>
<body>

    <svg width="0" height="0" style="display:none;">
        <defs>
            <g id="icon-book"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20" fill="none" stroke-width="2" stroke-linecap="round" pathLength="1"/></g>
            <g id="icon-radar"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></g>

    <main id="main">
    <div id="app-section">
        <header class="app-header">
            <div class="app-header-left">
                <h1>Radar</h1>
                <div class="status-text">
                    <div id="status-dot" class="pulse-dot"></div>
                    <span id="scan-status">Radar Active / 雷達運作中...</span>
                </div>
            </div>
        </header>

        <div class="main-view" id="main-scroll-area">
            <div id="radar-scan-view">
                <div class="radar-compass">
                    <div class="radar-ring inner"></div>
                    <div class="radar-ring middle"></div>
                    <div class="radar-sweep"></div>
                    <div class="radar-blip blip-1"></div>
                    <div class="radar-blip blip-2"></div>
                    <div class="radar-blip blip-3"></div>
                </div>
                
                <div class="scan-log-container">
                    <div class="scan-subtitle">Matching you with people you might be interested in...<br>正在為您匹配您可能感興趣的人...</div>
                </div>
            </div>

            <div id="match-container" class="view-hidden">
            </div>

        <nav class="bottom-tab-bar">
            <a href="index.html" class="tab-item" onclick="triggerHaptic()">
                <svg viewBox="0 0 24 24"><use href="#icon-book"/></svg>

                <svg viewBox="0 0 24 24"><use href="#icon-radar"/></svg>

                <svg viewBox="0 0 24 24"><use href="#icon-moment"/></svg>
                <span>Moment</span>
            </a>
            <a href="message.html" class="tab-item" onclick="triggerHaptic()">
                <svg viewBox="0 0 24 24"><use href="#icon-message"/></svg>
                <span>Message</span>
            </a>
            <a href="my/index.html" class="tab-item" onclick="triggerHaptic()">
                <svg viewBox="0 0 24 24"><use href="#icon-my"/></svg>
                <span>My</span>
            </a>
        </nav>
    </div>
    </main>

    <script>
        const SUPABASE_URL = "https://nhjkhtrgehznhdlqyybs.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_BFkX70SHXwbSmNzE_h7AQg_a1OwKkO_";
        
        let currentAccessToken = localStorage.getItem('aloka_sb_token') || null;
        let currentUserData = null;
        let myTags = [];

        const isLocalTesting = false; 

        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('copy', e => e.preventDefault());

        function triggerHaptic(duration = 15) {
            if (typeof navigator !== 'undefined' && navigator.vibrate) {
                navigator.vibrate(duration);
            }
        }

        function setStatus(text, isScanning) {
            document.getElementById('scan-status').innerText = text;
            const dot = document.getElementById('status-dot');
            if (isScanning) {
                dot.classList.remove('idle');
            } else {
                dot.classList.add('idle');
            }
        }

        /* --- ORIGINAL AUTH CHECK ROUTE REFACTOR --- */
        window.onload = async () => {
            if (!currentAccessToken) {
                window.location.href = 'index.html'; // 統一修正相對路徑跳轉
                return;
            }

            try {
                const userRes = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${currentAccessToken}` }
                });
                if (!userRes.ok) {
                    localStorage.removeItem('aloka_sb_token');
                    window.location.href = 'index.html'; // 統一修正相對路徑跳轉
                    return;
                }
                currentUserData = await userRes.json();

                const myProfileRes = await fetch(`${SUPABASE_URL}/rest/v1/profiles?id=eq.${currentUserData.id}&select=tags`, {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${currentAccessToken}` }
                });
                
                if (myProfileRes.ok) {
                    const myProfileData = await myProfileRes.json();
                    if (myProfileData.length > 0 && myProfileData[0].tags) {
                        try {
                            myTags = Array.isArray(myProfileData[0].tags) ? myProfileData[0].tags : JSON.parse(myProfileData[0].tags);
                        } catch(e) { myTags = []; }
                    }
                }

                startScanProcess();

            } catch (err) {
                console.error("Initialization Error:", err);
                setStatus("System offline / 系統連線異常", false);
                document.getElementById('status-dot').style.backgroundColor = '#ff3b30';
            }
        };

        function startScanProcess() {
            document.getElementById('match-container').classList.add('view-hidden');
            document.getElementById('match-container').innerHTML = '';
            document.getElementById('radar-scan-view').classList.remove('view-hidden');
            setStatus("Radar Active / 雷達運作中...", true);

            setTimeout(() => {
                fetchAndMatchProfiles();
            }, 2500); 
        }

        async function fetchAndMatchProfiles() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_radar_matches`, {
                    method: 'POST',
                    headers: { 
                        'apikey': SUPABASE_ANON_KEY, 
                        'Authorization': `Bearer ${currentAccessToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ current_user_id: currentUserData.id, match_threshold: 20 })
                });

                if (!res.ok) throw new Error("Failed to fetch matches");
                
                let matchesData = await res.json();
                if (!matchesData) matchesData = [];

                const myTagsLower = myTags.map(t => typeof t === 'string' ? t.toLowerCase().trim() : '');

                const formattedMatches = matchesData.map(match => {
                    let theirTags = [];
                    if (match.tags) {
                        try {
                            theirTags = Array.isArray(match.tags) ? match.tags : JSON.parse(match.tags);
                        } catch(e) {}
                    }
                    const sharedTags = theirTags.filter(t => myTagsLower.includes(t.toLowerCase().trim()));
                    
                    return {
                        ...match,
                        sharedTags: sharedTags,
                        allTags: theirTags
                    };
                });

                document.getElementById('radar-scan-view').classList.add('view-hidden');
                document.getElementById('match-container').classList.remove('view-hidden');
                
                renderMatches(formattedMatches);
                triggerHaptic(20);

            } catch (e) {
                console.error("Match error:", e);
                setStatus("Scan interrupted / 掃描程序中斷", false);
            }
        }

        function renderMatches(matches) {
            const container = document.getElementById('match-container');
            
            if (matches.length === 0) {
                setStatus("No matches / 暫無匹配", false);
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon-box">
                            <svg viewBox="0 0 24 24"><use href="#icon-user-x"/></svg>
                        </div>
                        <div class="empty-title">No matches nearby.</div>
                        <div class="empty-desc">There are no profiles matching your tags above 20% right now. Try expanding your interests to discover more people.<br><br>附近暫時沒有匹配度大於 20% 的用戶。可以嘗試在個人主頁新增更多標籤，以擴大探索範圍。</div>
                        <button class="btn-secondary" onclick="triggerHaptic(); window.location.href='my/index.html'">Edit Profile / 編輯主頁</button>
                    </div>
                `;
                return;
            }

            setStatus(`Found ${matches.length} matches / 已建立 ${matches.length} 個配對`, false);
            container.innerHTML = '';
            
            matches.forEach(match => {
                const avatarSrc = match.avatar_url ? match.avatar_url : 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23e5e5ea"><circle cx="12" cy="12" r="12"/></svg>';
                const nickname = match.nickname || "Anonymous";
                const location = match.location_city || "Unknown Location";

                let tagsHTML = '';
                match.sharedTags.forEach(t => {
                    tagsHTML += `<span class="tag-badge shared">${t}</span>`;
                });
                
                let unsharedCount = 0;
                match.allTags.forEach(t => {
                    if (!match.sharedTags.includes(t) && unsharedCount < 3) {
                        tagsHTML += `<span class="tag-badge">${t}</span>`;
                        unsharedCount++;
                    }
                });
                if (match.allTags.length > match.sharedTags.length + 3) {
                    tagsHTML += `<span class="tag-badge">...</span>`;
                }

                container.innerHTML += `
                    <div class="match-card">
                        <div class="match-header">
                            <img src="${avatarSrc}" alt="Avatar" class="avatar">
                            <div class="user-info">
                                <div class="nickname">${nickname}</div>
                                <div class="location">
                                    <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor"><use href="#icon-pin"/></svg>
                                    ${location}
                                </div>
                            </div>
                        </div>

                        <div>
                            <div class="similarity-row">
                                <span class="sim-label">Match Rate / 匹配度</span>
                                <span class="sim-score">${match.similarity}%</span>
                            </div>
                            <div style="width:100%; height:4px; background:var(--bg-sub); border-radius:2px; overflow:hidden; margin-bottom: 16px;">
                                <div style="width:${match.similarity}%; height:100%; background:var(--apple-blue); border-radius:2px;"></div>
                            </div>
                            
                            <div class="tags-container">
                                ${tagsHTML}
                            </div>
                        </div>

                        <button class="btn-message" onclick="triggerHaptic(); initiateChat('${match.id}', '${nickname.replace(/'/g, "\\'")}')">
                            <svg viewBox="0 0 24 24"><use href="#icon-send"/></svg>
                            Message / 私信
                        </button>
                    </div>
                `;
            });
        }

        async function initiateChat(targetUserId, targetNickname) {
            try {
                const user1 = currentUserData.id < targetUserId ? currentUserData.id : targetUserId;
                const user2 = currentUserData.id < targetUserId ? targetUserId : currentUserData.id;

                await fetch(`${SUPABASE_URL}/rest/v1/conversations`, {
                    method: 'POST',
                    headers: { 
                        'apikey': SUPABASE_ANON_KEY, 
                        'Authorization': `Bearer ${currentAccessToken}`, 
                        'Content-Type': 'application/json',
                        'Prefer': 'resolution=ignore-duplicates'
                    },
                    body: JSON.stringify({ user1_id: user1, user2_id: user2 })
                });

                window.location.href = `message.html?chat_with=${targetUserId}`;

            } catch (err) {
                console.error("Error initiating chat:", err);
                alert("無法發起對話，請稍後再試。");
            }
        }

        document.addEventListener('click', (e) => {
            if (e.target.closest('button, .tab-item')) { triggerHaptic(15); }
        });
    </script>
</body>
</html>
