<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Daily Story — 重置密码</title>

    <style>
        :root {
            /* ---- Apple 设计令牌（唯一数值来源） ---- */
            --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                "Helvetica Neue", "PingFang TC", "PingFang SC", "Hiragino Sans GB",
                "Microsoft YaHei", "Noto Sans TC", "Noto Sans SC", Arial, sans-serif;

            --ink-1: #1d1d1f; --ink-2: #424245; --ink-3: #6e6e73; --ink-4: #86868b;
            --line: rgba(0, 0, 0, 0.10);

            --surface-1: #ffffff; --surface-2: #fbfbfd; --surface-3: #f5f5f7;
            --surface-invert: #060607; --on-invert-1: #f5f5f7; --on-invert-2: #a1a1a6;
            --line-invert: rgba(255, 255, 255, 0.16);

            --accent: #0071e3; --accent-hover: #0077ed; --accent-press: #0068cf;
            --accent-wash: rgba(0, 113, 227, 0.06); --accent-on-dark: #2997ff;

            --error-color: #ff3b30; --success-color: #34c759;

            --radius-xs: 6px; --radius-sm: 10px; --radius-md: 18px;
            --radius-lg: 28px; --radius-pill: 999px;

            --ease-out: cubic-bezier(0.32, 0.72, 0, 1);
            --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
            --dur-fast: 200ms; --dur-base: 320ms; --dur-reveal: 640ms;
            --size-hit: 44px;

            --safe-top: env(safe-area-inset-top, 20px);
            --safe-bottom: env(safe-area-inset-bottom, 20px);

            /* ---- 旧变量别名（保留，禁止删除） ---- */
            --bg-paper: var(--surface-1);
            --bg-sub: var(--surface-3);
            --text-dark: var(--ink-1);
            --text-primary: var(--ink-1);
            --text-secondary: var(--ink-2);
            --text-muted: var(--ink-3);
            --line-light: var(--line);
            --apple-blue: var(--accent);
            --apple-blue-hover: var(--accent-hover);
            --apple-blue-light: var(--accent-wash);
            --radius: var(--radius-md);
            --ease-curve: var(--ease-out);
            --font-en: var(--font-sans);
            --font-tc: var(--font-sans);
            --glass-bg: rgba(255, 255, 255, 0.78);
        }

        [data-theme="dark"] {
            --bg-paper: #000000; --bg-sub: #1c1c1e;
            --text-dark: #f5f5f7; --text-muted: #8e8e93;
            --line-light: rgba(255, 255, 255, 0.12);
            --apple-blue-light: rgba(41, 151, 255, 0.14);
            --glass-bg: rgba(28, 28, 30, 0.78);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            font-family: var(--font-sans);
            background: var(--surface-1);
            color: var(--ink-1);
            -webkit-font-smoothing: antialiased;
            text-align: left;
            letter-spacing: 0.01em;
            overflow-x: clip;
            height: 100dvh;
            overflow: hidden;
            transition: background-color var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out);
        }

        :lang(zh), :lang(zh-TW), :lang(zh-Hant), :lang(zh-CN) { letter-spacing: 0.01em; }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
            border-radius: 2px;
        }

        .skip-link { position: absolute; left: -9999px; top: 0; z-index: 30; padding: 12px 16px; background: var(--surface-invert); color: var(--on-invert-1); }
        .skip-link:focus { left: 16px; top: 16px; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        .auth-container {
            width: 100%; min-height: 100dvh; display: flex; align-items: center; justify-content: flex-start;
            padding: 40px 32px; background: var(--surface-1);
        }
        main { width: 100%; }
        .auth-wrapper { width: 100%; max-width: 380px; position: relative; text-align: left; margin: 0 auto; }

        .brand-title { font-size: 34px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 8px; color: var(--ink-1); }
        .brand-subtitle { font-size: 15px; color: var(--ink-2); margin-bottom: 2.5rem; line-height: 1.5; }

        .field-label { display: block; font-size: 13px; font-weight: 500; color: var(--ink-2); margin-bottom: 8px; }

        .form-input {
            width: 100%; background: var(--surface-3); border: 1px solid var(--line); padding: 12px 16px;
            min-height: var(--size-hit);
            border-radius: var(--radius-sm); font-size: 16px; color: var(--ink-1);
            margin-bottom: 20px;
            transition: border-color var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out);
        }
        .form-input:focus { border-color: var(--accent); background: var(--surface-1); }

        .btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            min-height: var(--size-hit);
            padding: 0 20px;
            font-size: 16px;
            font-weight: 500;
            border: none;
            text-decoration: none;
            cursor: pointer;
            transition: background-color var(--dur-fast) var(--ease-out);
        }

        .btn.btn-primary {
            width: 100%;
            margin-bottom: 12px;
            border-radius: var(--radius-pill);
            color: #ffffff;
            background: var(--accent);
        }
        .btn.btn-primary:hover { background: var(--accent-hover); }
        .btn.btn-primary:active { background: var(--accent-press); }
        .btn.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

        .status-msg { font-size: 14px; line-height: 1.5; color: var(--ink-2); }
    </style>
</head>
<body>
    <a class="skip-link" href="#main">跳到主要内容</a>

    <div class="auth-container">
        <main id="main">
            <div class="auth-wrapper">
                <h1 class="brand-title">Daily Story</h1>
                <p class="brand-subtitle">Reset Password / 重置密碼</p>

                <label class="field-label" for="new-password">新密码 / New Password</label>
                <input type="password" class="form-input" id="new-password" placeholder="建立新密碼 / New Password" autocomplete="new-password" />

                <button class="btn btn-primary" id="btn-reset" onclick="handleReset()">Update Password / 確認修改</button>

                <div id="status-msg" class="status-msg"></div>
            </div>
        </main>
    </div>

    <script>
        // 帶入你在主程式中使用的 API 設定
        const SUPABASE_URL = "https://nhjkhtrgehznhdlqyybs.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_BFkX70SHXwbSmNzE_h7AQg_a1OwKkO_";

        let resetToken = null;

        window.onload = () => {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            resetToken = params.get('access_token');
            const type = params.get('type');

            const msgEl = document.getElementById('status-msg');

            // 檢查是不是正確的重置連結
            if (!resetToken || type !== 'recovery') {
                document.getElementById('new-password').style.display = 'none';
                document.getElementById('btn-reset').style.display = 'none';
                msgEl.style.color = 'var(--error-color)';
                msgEl.innerHTML = "Invalid or expired reset link.<br>無效或已過期的重置連結，請重新申請。";

                // 提供回到首頁的按鈕
                setTimeout(() => {
                    window.location.href = '/';
                }, 3000);
            }
        };

        async function handleReset() {
            const newPassword = document.getElementById('new-password').value;
            const msgEl = document.getElementById('status-msg');
            const btn = document.getElementById('btn-reset');

            if (!newPassword) {
                msgEl.style.color = 'var(--error-color)';
                msgEl.innerText = 'Please enter a new password. / 請輸入新密碼。';
                return;
            }

            btn.disabled = true;
            btn.innerText = 'Updating... / 修改中...';
            msgEl.innerText = '';

            try {
                // 呼叫 Supabase 更新使用者的 API，附帶網址中抓到的 token
                const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
                    method: 'PUT',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${resetToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ password: newPassword })
                });

                const data = await res.json();

                if (!res.ok) throw new Error(data.msg || data.error_description || 'Update failed');

                msgEl.style.color = 'var(--success-color)';
                msgEl.innerHTML = 'Password updated successfully! Redirecting...<br>密碼修改成功！即將跳轉至登入頁...';

                // 修改成功後，跳轉回主頁
                setTimeout(() => {
                    window.location.href = '/';
                }, 2500);

            } catch (err) {
                msgEl.style.color = 'var(--error-color)';
                msgEl.innerText = err.message || '發生錯誤，請稍後再試。';
                btn.disabled = false;
                btn.innerText = 'Update Password / 確認修改';
            }
        }
    </script>
</body>
</html>
