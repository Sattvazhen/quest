<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Reset Password · Daily Story</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        /* 沿用相同的 UI 樣式 */
        :root {
            --bg-paper: #ffffff;
            --bg-sub: #f5f5f7;
            --text-dark: #1d1d1f; 
            --text-muted: #86868b; 
            --apple-blue: #007AFF;
            --error-color: #ff3b30;
            --success-color: #34c759;
            --ease-curve: cubic-bezier(0.32, 0.72, 0, 1); 
            --font-en: 'Inter', -apple-system, sans-serif;
            --font-tc: 'Noto Sans TC', 'PingFang TC', sans-serif;
        }
        [data-theme="dark"] {
            --bg-paper: #000000; --bg-sub: #1c1c1e; --text-dark: #f5f5f7; --text-muted: #8e8e93;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: var(--font-en); background-color: var(--bg-paper); color: var(--text-dark);
            -webkit-font-smoothing: antialiased; text-align: left; height: 100vh; overflow: hidden;
            letter-spacing: 0.01em; transition: background-color 0.4s var(--ease-curve), color 0.4s var(--ease-curve);
        }
        .auth-container {
            width: 100%; min-height: 100dvh; display: flex; align-items: center; justify-content: flex-start;
            padding: 40px 32px; background: var(--bg-paper);
        }
        .auth-wrapper { width: 100%; max-width: 380px; position: relative; text-align: left; margin: 0 auto; }
        
        .brand-title { font-size: 34px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 8px; }
        .brand-subtitle { font-family: var(--font-tc); font-size: 15px; color: var(--text-muted); margin-bottom: 3.5rem; line-height: 1.5; }
        
        .form-input {
            width: 100%; background: var(--bg-sub); border: 1px solid transparent; padding: 18px 20px;
            border-radius: 16px; font-size: 16px; outline: none; color: var(--text-dark);
            margin-bottom: 20px; transition: all 0.4s var(--ease-curve);
        }
        .form-input:focus { border-color: var(--apple-blue); background: var(--bg-paper); }
        
        .btn-primary {
            width: 100%; font-size: 16px; font-weight: 600; padding: 18px; border-radius: 16px;
            cursor: pointer; transition: all 0.4s var(--ease-curve); display: inline-flex;
            justify-content: center; align-items: center; gap: 8px; margin-bottom: 12px;
            color: #ffffff; background: var(--apple-blue); border: none; text-decoration: none;
        }
        .btn-primary:active { transform: scale(0.95); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-wrapper" id="form-section">
            <div class="brand-title">Daily Story</div>
            <div class="brand-subtitle">Reset Password / 重置密碼</div>
            
            <input type="password" class="form-input" id="new-password" placeholder="New Password / 建立新密碼">
            
            <button class="btn-primary" id="btn-reset" onclick="handleReset()">Update Password / 確認修改</button>
            
            <div id="status-msg" style="font-size:14px; margin-top:12px; line-height: 1.4;"></div>
        </div>
    </div>

    <script>
        // 帶入你在主程式中使用的 API 設定
        const SUPABASE_URL = "https://nhjkhtrgehznhdlqyybs.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_BFkX70SHXwbSmNzE_h7AQg_a1OwKkO_";
        
        let resetToken = null;

        window.onload = () => {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            resetToken = params.get('access_token');
            const type = params.get('type');
            
            const msgEl = document.getElementById('status-msg');

            // 檢查是不是正確的重置連結
            if (!resetToken || type !== 'recovery') {
                document.getElementById('new-password').style.display = 'none';
                document.getElementById('btn-reset').style.display = 'none';
                msgEl.style.color = 'var(--error-color)';
                msgEl.innerHTML = "Invalid or expired reset link.<br>無效或已過期的重置連結，請重新申請。";
                
                // 提供回到首頁的按鈕
                setTimeout(() => {
                    window.location.href = '/';
                }, 3000);
            }
        };

        async function handleReset() {
            const newPassword = document.getElementById('new-password').value;
            const msgEl = document.getElementById('status-msg');
            const btn = document.getElementById('btn-reset');

            if (!newPassword) {
                msgEl.style.color = 'var(--error-color)';
                msgEl.innerText = 'Please enter a new password. / 請輸入新密碼。';
                return;
            }

            btn.disabled = true;
            btn.innerText = 'Updating... / 修改中...';
            msgEl.innerText = '';

            try {
                // 呼叫 Supabase 更新使用者的 API，附帶網址中抓到的 token
                const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
                    method: 'PUT',
                    headers: { 
                        'apikey': SUPABASE_ANON_KEY, 
                        'Authorization': `Bearer ${resetToken}`,
                        'Content-Type': 'application/json' 
                    },
                    body: JSON.stringify({ password: newPassword })
                });

                const data = await res.json();
                
                if (!res.ok) throw new Error(data.msg || data.error_description || 'Update failed');

                msgEl.style.color = 'var(--success-color)';
                msgEl.innerHTML = 'Password updated successfully! Redirecting...<br>密碼修改成功！即將跳轉至登入頁...';
                
                // 修改成功後，跳轉回主頁
                setTimeout(() => {
                    window.location.href = '/';
                }, 2500);

            } catch (err) {
                msgEl.style.color = 'var(--error-color)';
                msgEl.innerText = err.message || '發生錯誤，請稍後再試。';
                btn.disabled = false;
                btn.innerText = 'Update Password / 確認修改';
            }
        }
    </script>
</body>
</html>
