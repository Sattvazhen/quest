<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Daily Story — 邮箱验证</title>

    <style>
        :root {
            /* ---- Apple 设计令牌（唯一数值来源） ---- */
            --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                "Helvetica Neue", "PingFang TC", "PingFang SC", "Hiragino Sans GB",
                "Microsoft YaHei", "Noto Sans TC", "Noto Sans SC", Arial, sans-serif;

            --ink-1: #1d1d1f; --ink-2: #424245; --ink-3: #6e6e73; --ink-4: #86868b;
            --line: rgba(0, 0, 0, 0.10);

            --surface-1: #ffffff; --surface-2: #fbfbfd; --surface-3: #f5f5f7;
            --surface-invert: #060607; --on-invert-1: #f5f5f7; --on-invert-2: #a1a1a6;
            --line-invert: rgba(255, 255, 255, 0.16);

            --accent: #0071e3; --accent-hover: #0077ed; --accent-press: #0068cf;
            --accent-wash: rgba(0, 113, 227, 0.06); --accent-on-dark: #2997ff;

            --error-color: #ff3b30; --success-color: #34c759;

            --radius-xs: 6px; --radius-sm: 10px; --radius-md: 18px;
            --radius-lg: 28px; --radius-pill: 999px;

            --ease-out: cubic-bezier(0.32, 0.72, 0, 1);
            --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
            --dur-fast: 200ms; --dur-base: 320ms; --dur-reveal: 640ms;
            --size-hit: 44px;

            --safe-top: env(safe-area-inset-top, 20px);
            --safe-bottom: env(safe-area-inset-bottom, 20px);

            /* ---- 旧变量别名（保留，禁止删除） ---- */
            --bg-paper: var(--surface-1);
            --bg-sub: var(--surface-3);
            --text-dark: var(--ink-1);
            --text-primary: var(--ink-1);
            --text-secondary: var(--ink-2);
            --text-muted: var(--ink-3);
            --line-light: var(--line);
            --apple-blue: var(--accent);
            --apple-blue-hover: var(--accent-hover);
            --apple-blue-light: var(--accent-wash);
            --radius: var(--radius-md);
            --ease-curve: var(--ease-out);
            --font-en: var(--font-sans);
            --font-tc: var(--font-sans);
            --glass-bg: rgba(255, 255, 255, 0.78);
        }

        [data-theme="dark"] {
            --bg-paper: #000000; --bg-sub: #1c1c1e;
            --text-dark: #f5f5f7; --text-muted: #8e8e93;
            --line-light: rgba(255, 255, 255, 0.12);
            --apple-blue-light: rgba(41, 151, 255, 0.14);
            --glass-bg: rgba(28, 28, 30, 0.78);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            font-family: var(--font-sans);
            background: var(--surface-1);
            color: var(--ink-1);
            -webkit-font-smoothing: antialiased;
            text-align: left;
            letter-spacing: 0.01em;
            overflow-x: clip;
            height: 100dvh;
            overflow: hidden;
            transition: background-color var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out);
        }

        :lang(zh), :lang(zh-TW), :lang(zh-Hant), :lang(zh-CN) { letter-spacing: 0.01em; }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
            border-radius: 2px;
        }

        .skip-link { position: absolute; left: -9999px; top: 0; z-index: 30; padding: 12px 16px; background: var(--surface-invert); color: var(--on-invert-1); }
        .skip-link:focus { left: 16px; top: 16px; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        .auth-container {
            width: 100%; min-height: 100dvh; display: flex; align-items: center; justify-content: flex-start;
            padding: 40px 32px; background: var(--surface-1);
        }
        main { width: 100%; }
        .auth-wrapper { width: 100%; max-width: 380px; position: relative; text-align: left; margin: 0 auto; }

        .brand-title { font-size: 34px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 8px; color: var(--ink-1); }
        .brand-subtitle { font-size: 15px; color: var(--ink-2); margin-bottom: 3.5rem; line-height: 1.5; }

        .btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            min-height: var(--size-hit);
            padding: 0 20px;
            font-size: 16px;
            font-weight: 500;
            border: none;
            text-decoration: none;
            cursor: pointer;
            transition: background-color var(--dur-fast) var(--ease-out);
        }

        .btn.btn-primary {
            width: 100%;
            margin-bottom: 12px;
            border-radius: var(--radius-pill);
            color: #ffffff;
            background: var(--accent);
        }
        .btn.btn-primary:hover { background: var(--accent-hover); }
        .btn.btn-primary:active { background: var(--accent-press); }

        .status-msg { font-size: 16px; margin-bottom: 24px; font-weight: 500; line-height: 1.5; color: var(--ink-2); }
    </style>
</head>
<body>
    <a class="skip-link" href="#main">跳到主要内容</a>

    <div class="auth-container">
        <main id="main">
            <div class="auth-wrapper">
                <h1 class="brand-title">Daily Story</h1>
                <p class="brand-subtitle">Email Verification / 信箱驗證</p>

                <div id="status-message" class="status-msg" style="color: var(--text-muted);">
                    Verifying your email, please wait...<br>正在驗證您的信箱，請稍候...
                </div>

                <a href="/" class="btn btn-primary" id="btn-home" style="display: none;">
                    Go to Sign In / 前往登入
                </a>
            </div>
        </main>
    </div>

    <script>
        window.onload = () => {
            const msgEl = document.getElementById('status-message');
            const btnEl = document.getElementById('btn-home');

            // 解析 Supabase 網址 Hash (例如: #access_token=...&type=signup)
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            const accessToken = params.get('access_token');
            const type = params.get('type');

            if (accessToken) {
                // 如果抓到了 token，通常代表 Supabase 已經自動驗證成功
                msgEl.innerHTML = "Verification Successful!<br>驗證成功！您可以開始使用您的帳號了。";
                msgEl.style.color = "var(--success-color)";

                // 將 token 存入 localStorage，讓使用者跳轉回主頁時自動登入
                localStorage.setItem('aloka_sb_token', accessToken);

                btnEl.style.display = "flex";
                btnEl.innerText = "Enter Daily Story / 進入日記";
            } else {
                // 沒有 token，可能是連結失效或使用者直接開啟此頁面
                const errorDesc = params.get('error_description');
                if (errorDesc) {
                    msgEl.innerHTML = `Verification Failed: ${errorDesc}<br>驗證失敗，請重新獲取驗證信。`;
                } else {
                    msgEl.innerHTML = "Invalid link.<br>無效的驗證連結。";
                }
                msgEl.style.color = "var(--error-color)";
                btnEl.style.display = "flex";
            }
        };
    </script>
</body>
</html>
